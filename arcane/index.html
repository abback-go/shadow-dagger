  body{display:flex;align-items:center;justify-content:center}

<body>
<canvas id="game" width="1280" height="720"></canvas>
<script>
"use strict";
/* =====================================================================
 * 아르카나 아카데미 — 전투/이동 프로토타입 v0.1
 * 범위: 튜토리얼 맵(입문의 숲), 이동/점프/하강점프/대시,
 *       기본 스킬(Z 불티, X 화염구 차지), 몬스터 2종+허수아비,
 *       레벨/경험치, 타격감(히트스톱·셰이크·파티클·데미지넘버·콤보)
 * 그래픽: 플레이스홀더(도형) — 추후 도트 스프라이트로 교체 예정
 * ===================================================================== */

// ============================== CONFIG ==============================
const VIEW_W = 1280, VIEW_H = 720;
const MAP_W = 4400, GROUND_Y = 640;
const GATE_X = 3620, ARENA_L = 3660, ARENA_R = 4360;   // 학기말 실기 시험장
const DT = 1 / 120;                       // 고정 타임스텝
const GRAV = 2600;

const P = {                               // 플레이어 튜닝
  w: 30, h: 46,
  runSpeed: 340, accel: 2800, friction: 2400, airControl: 0.72,
  jumpV: -880, dropTime: 0.22,
  dashSpeed: 760, dashTime: 0.16, dashCd: 0.9,
  maxHp: 150, maxMp: 100, mpRegen: 7,
  hurtIframes: 1.0,
};

const SKILL = {
  bolt:    { cd: 0.22, dmg: [9, 13], speed: 820, range: 520, name: "불티" },
  fireball:{ cdAfter: 0.55, mp: 15, minCharge: 0.15, maxCharge: 0.9,
             dmg: [22, 30], dmgMaxMul: 2.4, speed: 640, name: "화염구" },
  field:   { cd: 6, mp: 20, dur: 4.0, tick: 0.35, dmg: [6, 9], width: 150, name: "화염 장판" },
};
const CRIT_MUL = 1.5;

// --- 스탯 랭크 시스템 (D- ~ SSS) : 기획서 §6.1
const RANKS = ["D-","D","D+","C-","C","C+","B-","B","B+","A-","A","A+","S","SS","SSS"];
const RANK_NEED = [50,70,100,140,190,250,330,430,560,720,920,1200,1600,2200,Infinity]; // 다음 랭크까지 수련치
const STAT_DEFS = {
  str: { name:"근력", desc:"넉백·물리 위력" },
  mag: { name:"마력", desc:"마법 데미지·최대 MP·차지 속도" },
  agi: { name:"민첩", desc:"이동속도·대시 쿨·크리티컬" },
  vit: { name:"체력", desc:"최대 HP·피해 감소" },
  wil: { name:"정신", desc:"MP 회복·집중" },
};
const TRAIN_SIZE = { "소":25, "중":60, "대":120, "특대":250 };
const ACTION_TRAIN_CAP = 40;   // 행동 성장(플레이로 단련) 스탯당 상한

const MOB_DEFS = {
  dummy:    { name:"허수아비",   hp: 999999, w: 34, h: 56, speed: 0,   dmg: 0,  exp: 0,  color:"#9a7b4f", contact:false },
  slime:    { name:"숲 슬라임",  hp: 34,     w: 36, h: 26, speed: 46,  dmg: 10, exp: 8,  color:"#5fd068", contact:true  },
  mushroom: { name:"주황버섯",   hp: 62,     w: 34, h: 40, speed: 74,  dmg: 15, exp: 15, color:"#e8843c", contact:true  },
  boss:     { name:"숲의 수호자 그루트닉", hp: 620, w: 92, h: 116, speed: 0, dmg: 20, exp: 220, color:"#5e7a4a", contact:true },
};
const RESPAWN_TIME = 5.0;

function expNeed(lv){ return Math.floor(30 * Math.pow(lv, 1.45)); }

// ============================== UTILS ==============================
const clamp = (v,a,b)=> v<a?a : v>b?b : v;
const lerp  = (a,b,t)=> a+(b-a)*t;
const rand  = (a,b)=> a + Math.random()*(b-a);
const irand = (a,b)=> Math.floor(rand(a,b+1));
const sign  = v => v<0?-1:1;

// ============================== INPUT ==============================
const keys = {};
const pressed = {};   // 이번 프레임에 눌림(엣지)
addEventListener("keydown", e=>{
  if(["ArrowLeft","ArrowRight","ArrowUp","ArrowDown"," ","Tab"].includes(e.key)) e.preventDefault();
  const k = norm(e.key);
  if(!keys[k]) pressed[k] = true;
  keys[k] = true;
});
addEventListener("keyup", e=>{ keys[norm(e.key)] = false; });
function norm(k){
  if(k === " ") return "space";
  return k.length===1 ? k.toLowerCase() : k;
}
const inp = {
  left:  ()=> keys["ArrowLeft"],
  right: ()=> keys["ArrowRight"],
  down:  ()=> keys["ArrowDown"],
  jumpP: ()=> pressed["space"] || pressed["ArrowUp"],
  dashP: ()=> pressed["Shift"],
  boltP: ()=> pressed["z"],
  fbHeld:()=> keys["x"],
  helpP: ()=> pressed["h"],
  bookP: ()=> pressed["Tab"],
};

// ============================== JUICE ==============================
const juice = {
  hitstop: 0, trauma: 0, flash: 0, zoom: 0,
  addShake(t){ this.trauma = Math.min(1, this.trauma + t); },
  addHitstop(s){ this.hitstop = Math.max(this.hitstop, s); },
  shakeOffset(){
    const s = this.trauma * this.trauma;
    return { x: rand(-1,1)*22*s, y: rand(-1,1)*16*s };
  },
};

const particles = [];
function spawnParticles(x, y, opt){
  const n = opt.n ?? 8;
  for(let i=0;i<n;i++){
    const ang = opt.ang !== undefined ? opt.ang + rand(-opt.spread, opt.spread) : rand(0, Math.PI*2);
    const sp = rand(opt.sp0 ?? 60, opt.sp1 ?? 260);
    particles.push({
      x, y, vx: Math.cos(ang)*sp, vy: Math.sin(ang)*sp,
      life: rand(opt.l0 ?? 0.25, opt.l1 ?? 0.6), t: 0,
      r: rand(opt.r0 ?? 2, opt.r1 ?? 5),
      col: Array.isArray(opt.col) ? opt.col[irand(0,opt.col.length-1)] : opt.col,
      grav: opt.grav ?? 0, add: opt.add ?? false, drag: opt.drag ?? 0.98,
    });
  }
}
function updateParticles(dt){
  for(let i=particles.length-1;i>=0;i--){
    const p = particles[i];
    p.t += dt;
    if(p.t >= p.life){ particles.splice(i,1); continue; }
    p.vx *= p.drag; p.vy = p.vy*p.drag + p.grav*dt;
    p.x += p.vx*dt; p.y += p.vy*dt;
  }
}

const dmgNumbers = [];
function addDmgNumber(x, y, val, crit){
  dmgNumbers.push({ x: x+rand(-8,8), y, val, crit, t: 0, life: 0.85 });
}
const floatTexts = [];
function addFloatText(x, y, text, col){
  floatTexts.push({ x, y, text, col, t: 0, life: 1.6 });
}

// 콤보
const combo = { count: 0, timer: 0, best: 0,
  hit(){ this.count++; this.timer = 2.0; this.best = Math.max(this.best, this.count); },
  update(dt){ if(this.timer > 0){ this.timer -= dt; if(this.timer <= 0) this.count = 0; } },
};

// ============================== MAP ==============================
// 지형: 위에서만 밟는 원웨이 플랫폼 + 바닥
const platforms = [
  { x: 0,    y: GROUND_Y, w: MAP_W, h: 80, solidGround: true },  // 바닥(하강점프 불가)
  // 점프 연습 구간
  { x: 860,  y: 540, w: 170, h: 14 },
  { x: 1100, y: 460, w: 170, h: 14 },
  { x: 1340, y: 540, w: 170, h: 14 },
  // 슬라임 구간 위 발판
  { x: 1750, y: 500, w: 200, h: 14 },
  { x: 2050, y: 430, w: 200, h: 14 },
  // 버섯 구간 발판
  { x: 2600, y: 520, w: 180, h: 14 },
  { x: 2880, y: 450, w: 180, h: 14 },
];

const signs = [
  { x: 240,  text: "← → 이동  /  Space 점프" },
  { x: 640,  text: "Z: 불티 (기본 마법)  — 허수아비에 연습!" },
  { x: 1000, text: "발판 위에서 ↓+Space: 아래로 내려가기" },
  { x: 1420, text: "Shift: 대시 (짧은 무적!)" },
  { x: 1700, text: "X 누르고 있기: 화염구 차지 → 놓으면 발사!" },
  { x: 3460, text: "전방: 학기말 실기 시험장!" },
  { x: 4340, text: "1학기 수료! — 다음 업데이트에서 계속" },
];

// 배경 나무(플레이스홀더) — 결정적 배치
const bgTrees = [];
for(let i=0;i<34;i++){
  const t = i / 34;
  bgTrees.push({ x: 60 + i*130 + (i*97 % 50), h: 180 + (i*53 % 120), layer: i%2 });
}

// ============================== PLAYER ==============================
const player = {
  x: 140, y: GROUND_Y, vx: 0, vy: 0, facing: 1,
  onGround: false, dropTimer: 0,
  dashTimer: 0, dashCd: 0, dashDir: 1,
  boltCd: 0, fbCharge: -1, fbCd: 0, fieldCd: 0,   // fbCharge<0 = 비차지
  hp: P.maxHp, mp: P.maxMp,
  level: 1, exp: 0,
  // 스탯 랭크: r = RANKS 인덱스(1 = "D", 휴먼 시작), tp = 수련치, act = 행동 성장 누적
  stats: {
    str:{ r:1, tp:0, act:0 }, mag:{ r:1, tp:0, act:0 }, agi:{ r:1, tp:0, act:0 },
    vit:{ r:1, tp:0, act:0 }, wil:{ r:1, tp:0, act:0 },
  },
  iframes: 0, hurtFlash: 0, dead: false, deadTimer: 0,
  trail: [], animT: 0, castT: 0,
};

function playerRect(){
  return { x: player.x - P.w/2, y: player.y - P.h, w: P.w, h: P.h };
}

// ============================== 스탯 랭크 ==============================
// 내부는 수치, 화면엔 랭크만 (기획서 §6.1.7)
function rankIdx(k){ return player.stats[k].r; }
function maxHp(){ return P.maxHp + (rankIdx("vit")-1)*10; }
function maxMp(){ return P.maxMp + (rankIdx("mag")-1)*6; }
function magMul(){ return 1 + (rankIdx("mag")-1)*0.06; }        // 마법 데미지
function strMul(){ return 1 + (rankIdx("str")-1)*0.05; }        // 넉백/물리
function critChance(){ return 0.12 + (rankIdx("agi")-1)*0.008; }
function agiSpeedMul(){ return 1 + (rankIdx("agi")-1)*0.02; }
function dashCdMul(){ return Math.max(0.5, 1 - (rankIdx("agi")-1)*0.03); }
function wilRegenMul(){ return 1 + (rankIdx("wil")-1)*0.06; }
function vitDmgMul(){ return Math.max(0.5, 1 - (rankIdx("vit")-1)*0.02); }
function chargeSpeedMul(){ return 1 + (rankIdx("mag")-1)*0.04; }
function rankColor(rank){
  const c = rank[0];
  if(rank === "SSS") return "#f472b6";
  if(rank === "SS")  return "#fb923c";
  if(rank === "S")   return "#fbbf24";
  return c==="D" ? "#9ca3af" : c==="C" ? "#4ade80" : c==="B" ? "#60a5fa" : "#c084fc";
}
function overallRank(){
  const keys = Object.keys(STAT_DEFS);
  const avg = Math.round(keys.reduce((s,k)=>s+player.stats[k].r,0)/keys.length);
  return RANKS[clamp(avg, 0, RANKS.length-1)];
}

const rankBanners = [];
function trainStat(key, amount, fromAction){
  const st = player.stats[key];
  if(fromAction){
    if(st.act >= ACTION_TRAIN_CAP) return;   // 행동 성장 상한
    st.act += amount;
  }
  if(st.r >= RANKS.length-1) return;
  st.tp += amount;
  while(st.tp >= RANK_NEED[st.r] && st.r < RANKS.length-1){
    st.tp -= RANK_NEED[st.r];
    st.r++;
    const rank = RANKS[st.r];
    rankBanners.push({ text: `${STAT_DEFS[key].name}  ${RANKS[st.r-1]} → ${rank}`, col: rankColor(rank), t: 0, life: 2.2 });
    juice.addHitstop(0.12); juice.addShake(0.3); juice.flash = Math.max(juice.flash, 0.3);
    spawnParticles(player.x, player.y - P.h/2, { n: 34, col: [rankColor(rank), "#fff"], sp0: 100, sp1: 380, l0: .4, l1: .9, add: true, grav: -80 });
  }
}

// ============================== 퀘스트 ==============================
// 튜토리얼 체인 — 보상에 스탯 수련치 [소/중/대] 표기 (기획서 §6.1.3)
const QUESTS = [
  { name:"훈련 첫걸음", desc:"허수아비에 불티 10회 적중", type:"boltHit", need:10,
    rewards:[["mag","중"]], exp:20 },
  { name:"숲 정리",     desc:"숲 슬라임 5마리 처치", type:"kill", target:"slime", need:5,
    rewards:[["agi","중"],["str","소"]], exp:45 },
  { name:"차지 감각",   desc:"MAX 차지 화염구 3회 명중", type:"maxChargeHit", need:3,
    rewards:[["mag","대"],["wil","중"]], exp:60 },
  { name:"버섯 소탕",   desc:"주황버섯 3마리 처치", type:"kill", target:"mushroom", need:3,
    rewards:[["vit","중"],["mag","중"],["str","소"]], exp:80 },
  { name:"학기말 실기 시험", desc:"숲 끝 시험장의 수호자를 쓰러뜨려라", type:"kill", target:"boss", need:1,
    rewards:[["mag","특대"],["vit","대"],["str","중"]], exp:200 },
];
const questState = { idx: 0, prog: 0, doneAll: false, banner: null };
function curQuest(){ return questState.doneAll ? null : QUESTS[questState.idx]; }
function questEvent(type, target){
  const q = curQuest();
  if(!q || q.type !== type) return;
  if(q.target && q.target !== target) return;
  questState.prog++;
  if(questState.prog >= q.need) completeQuest();
}
function completeQuest(){
  const q = QUESTS[questState.idx];
  const rewardText = q.rewards.map(([k,s])=>`${STAT_DEFS[k].name} 수련치 [${s}]`).join("   ");
  questBanner(`퀘스트 완료!  — ${q.name}`, `보상: ${rewardText}   EXP +${q.exp}`, "Tab: 학생 수첩에서 스탯 확인");
  for(const [k,s] of q.rewards) trainStat(k, TRAIN_SIZE[s], false);
  gainExp(q.exp);
  juice.flash = Math.max(juice.flash, 0.2);
  questState.idx++;
  questState.prog = 0;
  if(questState.idx >= QUESTS.length) questState.doneAll = true;
  saveGame();
}
function questBanner(title, sub, sub2){
  questState.banner = { title, sub, sub2, t: 0, life: 3.4 };
}

// ============================== 수업 & NPC ==============================
// 수업 = 스킬 습득 콘텐츠 (기획서 §7): 교수에게 배우고 과제로 정식 습득
const PROF = { x: 430, name: "아그니스 교수" };
const LESSON = {
  name: "기초 화염진", skill: "화염 장판", need: 20,
  rewardText: "마력 수련치 [대]  정신 수련치 [소]  EXP +60",
};
const lessonState = { status: "avail", prog: 0 };   // avail → active → done
let dialog = null;
function startDialog(lines, onEnd){ dialog = { lines, i: 0, onEnd: onEnd || null }; }
function advanceDialog(){
  if(!dialog) return;
  dialog.i++;
  if(dialog.i >= dialog.lines.length){
    const cb = dialog.onEnd; dialog = null;
    if(cb) cb();
  }
}
function talkToProf(){
  if(lessonState.status === "avail"){
    startDialog([
      "오, 신입생이군! 나는 화염술 담당 아그니스 교수다.",
      "오늘 수업은 「화염 장판」 — 지면에 마력을 태워 새기는 기초 화염진이지.",
      "임시로 술식을 각인해주마. C 키로 시전해 보게. (MP 20)",
      "과제: 화염 장판의 불길로 몬스터를 20회 지지면 합격이다!",
    ], ()=>{
      lessonState.status = "active";
      addFloatText(player.x, player.y - P.h - 60, "수업 시작: " + LESSON.name, "#8be9fd");
      addFloatText(player.x, player.y - P.h - 34, "임시 습득: 화염 장판 (C)", "#ffb35c");
      saveGame();
    });
  }else if(lessonState.status === "active"){
    startDialog([
      `아직 과제가 남았네. 장판 적중 ${lessonState.prog}/${LESSON.need}!`,
      "숲의 슬라임들에게 시험해 보게. 발밑에 깔고 유인하는 게 요령이다.",
    ]);
  }else{
    startDialog([
      "훌륭한 화염진이었다. 이제 그 술식은 완전히 자네 것이야.",
      "다음 수업도 기대하지, 견습생.",
    ]);
  }
}
function lessonComplete(){
  lessonState.status = "done";
  questBanner(`수업 이수!  — ${LESSON.name}`,
              `신규 스킬 정식 습득: ${LESSON.skill} (C)`,
              "보상: " + LESSON.rewardText);
  trainStat("mag", TRAIN_SIZE["대"], false);
  trainStat("wil", TRAIN_SIZE["소"], false);
  gainExp(60);
  saveGame();
}

// --- 화염 장판 (수업으로 습득하는 설치기)
const fields = [];
function castField(){
  const pl = player;
  pl.fieldCd = SKILL.field.cd;
  pl.mp -= SKILL.field.mp;
  const fy = pl.onGround ? pl.y : GROUND_Y;
  fields.push({ x: pl.x + pl.facing * 90, y: fy, t: 0, tickT: 0, w: SKILL.field.width });
  juice.addShake(0.1);
  spawnParticles(pl.x + pl.facing*90, fy - 6, { n: 12, col: ["#ff7b3a","#ffd27f"], sp0: 40, sp1: 160, l0: .2, l1: .5, add: true, grav: -120 });
}
function updateFields(dt){
  for(let i=fields.length-1;i>=0;i--){
    const f = fields[i];
    f.t += dt; f.tickT += dt;
    if(Math.random() < 0.3)
      spawnParticles(f.x + rand(-f.w/2, f.w/2), f.y - rand(0, 12), { n: 1, col: ["#ff7b3a","#ffb35c","#ffe08a"], sp0: 10, sp1: 60, l0: .2, l1: .5, add: true, grav: -160, r0: 2, r1: 4 });
    if(f.tickT >= SKILL.field.tick){
      f.tickT -= SKILL.field.tick;
      for(const m of monsters){
        if(m.dead) continue;
        const d = MOB_DEFS[m.type];
        if(Math.abs(m.y - f.y) > 60) continue;
        if(m.x + d.w/2 < f.x - f.w/2 || m.x - d.w/2 > f.x + f.w/2) continue;
        hitMonster(m, Math.floor(irand(SKILL.field.dmg[0], SKILL.field.dmg[1]) * magMul()),
                   20 * sign(m.x - f.x || 1), { type: "field", hitstop: 0.004, shake: 0.015 });
      }
    }
    if(f.t >= SKILL.field.dur) fields.splice(i,1);
  }
}

// ============================== SAVE (localStorage) ==============================
const SAVE_KEY = "arcane_proto_save_v1";
let saveTimer = 8, saveFlash = 0, resetArm = 0;
function saveGame(){
  try{
    localStorage.setItem(SAVE_KEY, JSON.stringify({
      v: 1, level: player.level, exp: player.exp, stats: player.stats,
      quest: { idx: questState.idx, prog: questState.prog, doneAll: questState.doneAll },
      lesson: { status: lessonState.status, prog: lessonState.prog },
      bossDefeated: boss.defeated,
      x: Math.round(player.x), best: combo.best,
    }));
    saveFlash = 1.4;
  }catch(e){ /* 시크릿 모드 등 저장 불가 환경 무시 */ }
}
function loadGame(){
  try{
    const d = JSON.parse(localStorage.getItem(SAVE_KEY) || "null");
    if(!d || d.v !== 1) return;
    player.level = d.level; player.exp = d.exp;
    for(const k in player.stats) if(d.stats && d.stats[k]) player.stats[k] = d.stats[k];
    if(d.quest) Object.assign(questState, d.quest);
    if(d.lesson) Object.assign(lessonState, d.lesson);
    if(d.bossDefeated){ boss.defeated = true; BOSS_M.dead = true; BOSS_M.respawn = Infinity; }
    player.x = clamp(d.x || 140, P.w/2, MAP_W - P.w/2);
    combo.best = d.best || 0;
    player.hp = maxHp(); player.mp = maxMp();
    addFloatText(player.x, GROUND_Y - 110, "이어하기 — 저장 데이터 불러옴", "#8be9fd");
  }catch(e){}
}

function updatePlayer(dt){
  const pl = player;
  if(pl.dead){
    pl.deadTimer -= dt;
    if(pl.deadTimer <= 0) respawnPlayer();
    return;
  }

  const locked = dialog !== null || showBook;   // 대화·수첩 중 조작 잠금

  // --- 타이머
  pl.boltCd = Math.max(0, pl.boltCd - dt);
  pl.fbCd   = Math.max(0, pl.fbCd - dt);
  pl.fieldCd = Math.max(0, pl.fieldCd - dt);
  pl.dashCd = Math.max(0, pl.dashCd - dt);
  pl.dropTimer = Math.max(0, pl.dropTimer - dt);
  pl.iframes = Math.max(0, pl.iframes - dt);
  pl.hurtFlash = Math.max(0, pl.hurtFlash - dt);
  pl.castT = Math.max(0, pl.castT - dt);
  pl.animT += dt;
  pl.mp = Math.min(maxMp(), pl.mp + P.mpRegen * wilRegenMul() * dt);

  const charging = pl.fbCharge >= 0;

  // --- 대시
  if(!locked && inp.dashP() && pl.dashCd <= 0 && !charging){
    pl.dashTimer = P.dashTime;
    pl.dashCd = P.dashCd * dashCdMul();
    trainStat("agi", 0.5, true);
    pl.dashDir = (inp.left() && !inp.right()) ? -1 : (inp.right() ? 1 : pl.facing);
    pl.facing = pl.dashDir;
    pl.vy = 0;
    spawnParticles(pl.x, pl.y - P.h/2, { n: 10, col: ["#ffd27f","#fff"], sp0: 40, sp1: 140, l0: .15, l1: .35, add: true });
  }

  if(pl.dashTimer > 0){
    pl.dashTimer -= dt;
    pl.vx = pl.dashDir * P.dashSpeed;
    pl.vy = 0;
    pl.trail.push({ x: pl.x, y: pl.y, t: 0.22, f: pl.facing });
  }else{
    // --- 좌우 이동
    const mv = locked ? 0 : (inp.right()?1:0) - (inp.left()?1:0);
    const ctrl = pl.onGround ? 1 : P.airControl;
    const speedCap = (charging ? P.runSpeed * 0.4 : P.runSpeed) * agiSpeedMul();
    if(mv !== 0){
      pl.facing = mv;
      pl.vx += mv * P.accel * ctrl * dt;
      pl.vx = clamp(pl.vx, -speedCap, speedCap);
    }else{
      const f = P.friction * ctrl * dt;
      if(Math.abs(pl.vx) <= f) pl.vx = 0; else pl.vx -= sign(pl.vx)*f;
    }
    // --- 점프 / 하강점프
    if(!locked && inp.jumpP()){
      if(pl.onGround){
        if(inp.down() && pl.standingOneway){
          pl.dropTimer = P.dropTime;         // 플랫폼 통과
          pl.onGround = false;
        }else{
          pl.vy = P.jumpV;
          pl.onGround = false;
          trainStat("agi", 0.2, true);
          spawnParticles(pl.x, pl.y, { n: 6, col: "#cbd5e1", sp0: 30, sp1: 90, l0: .2, l1: .4, ang: -Math.PI/2, spread: 1.2 });
        }
      }
    }
    pl.vy += GRAV * dt;
  }

  // --- 트레일 감쇠
  for(let i=pl.trail.length-1;i>=0;i--){
    pl.trail[i].t -= dt;
    if(pl.trail[i].t <= 0) pl.trail.splice(i,1);
  }

  // --- 이동 & 충돌
  pl.x = clamp(pl.x + pl.vx*dt, P.w/2, MAP_W - P.w/2);
  if(boss.active && !BOSS_M.dead){
    pl.x = clamp(pl.x, ARENA_L + 20, ARENA_R - 20);          // 시험 중 가시벽
  }else if(!boss.defeated && !bossReady()){
    if(pl.x > GATE_X - 24){                                   // 시험 자격 전 가시문
      pl.x = GATE_X - 24;
      if(Math.random() < 0.02) addFloatText(GATE_X - 60, GROUND_Y - 120, "남은 퀘스트를 완료하면 시험장이 열린다", "#f0abfc");
    }
  }
  const prevFeet = pl.y;
  pl.y += pl.vy*dt;
  pl.onGround = false;
  pl.standingOneway = false;
  if(pl.vy >= 0){
    for(const pf of platforms){
      if(!pf.solidGround && pl.dropTimer > 0) continue;
      if(pl.x < pf.x || pl.x > pf.x + pf.w) continue;
      if(prevFeet <= pf.y + 1 && pl.y >= pf.y){
        pl.y = pf.y; pl.vy = 0; pl.onGround = true;
        pl.standingOneway = !pf.solidGround;
        break;
      }
    }
  }

  // --- 스킬: Z 불티
  if(!locked && inp.boltP() && pl.boltCd <= 0 && !charging && pl.dashTimer <= 0){
    pl.boltCd = SKILL.bolt.cd;
    fireBolt();
  }

  // --- 스킬: X 화염구(차지)
  if(!locked && !charging && inp.fbHeld() && pl.fbCd <= 0 && pl.mp >= SKILL.fireball.mp && pl.dashTimer <= 0){
    pl.fbCharge = 0;
  }
  if(charging){
    if(locked){
      pl.fbCharge = -1;   // 대화/수첩 열면 차지 취소
    }else{
      pl.fbCharge = Math.min(SKILL.fireball.maxCharge, pl.fbCharge + dt * chargeSpeedMul());
      if((pl.fbCharge/SKILL.fireball.maxCharge) > 0.35 && Math.random() < 0.5){
        spawnParticles(pl.x + pl.facing*24, pl.y - 56, { n: 1, col: ["#ff9d4d","#ffd27f"], sp0: 10, sp1: 60, l0: .15, l1: .3, add: true });
      }
      if(!inp.fbHeld()){
        const t = pl.fbCharge;
        pl.fbCharge = -1;
        if(t >= SKILL.fireball.minCharge){
          pl.mp -= SKILL.fireball.mp;
          pl.fbCd = SKILL.fireball.cdAfter;
          fireFireball(t / SKILL.fireball.maxCharge);
        }
      }
    }
  }

  // --- 스킬: C 화염 장판 (수업으로 습득)
  if(!locked && pressed["c"] && lessonState.status !== "avail" &&
     pl.fieldCd <= 0 && pl.mp >= SKILL.field.mp && pl.dashTimer <= 0 && pl.fbCharge < 0){
    castField();
  }
}

function respawnPlayer(){
  player.dead = false;
  player.x = 140; player.y = GROUND_Y; player.vx = 0; player.vy = 0;
  player.hp = maxHp(); player.mp = maxMp();
  player.iframes = 2.0;
  addFloatText(player.x, player.y - 80, "다시 도전!", "#8be9fd");
}

function hurtPlayer(dmg, fromX){
  const pl = player;
  if(pl.iframes > 0 || pl.dashTimer > 0 || pl.dead) return;
  dmg = Math.max(1, Math.round(dmg * vitDmgMul()));   // 체력 랭크 피해 감소
  trainStat("vit", 1.2, true);                         // 행동 성장: 맞으며 단련
  pl.hp -= dmg;
  pl.iframes = P.hurtIframes;
  pl.hurtFlash = 0.3;
  pl.vx = sign(pl.x - fromX) * 320;
  pl.vy = -300;
  pl.onGround = false;
  if(pl.fbCharge >= 0) pl.fbCharge = -1;   // 피격 시 차지 취소
  juice.addShake(0.45); juice.addHitstop(0.06);
  spawnParticles(pl.x, pl.y - P.h/2, { n: 10, col: ["#ff6b6b","#fca5a5"], sp0: 80, sp1: 240, l0: .2, l1: .45, grav: 500 });
  addDmgNumber(pl.x, pl.y - P.h - 10, dmg, false);
  if(pl.hp <= 0){
    pl.hp = 0; pl.dead = true; pl.deadTimer = 2.0;
    combo.count = 0; combo.timer = 0;
    juice.addShake(0.9); juice.addHitstop(0.15);
    spawnParticles(pl.x, pl.y - P.h/2, { n: 26, col: ["#ff6b6b","#fff"], sp0: 100, sp1: 380, l0: .3, l1: .7, grav: 600 });
  }
}

function gainExp(amount){
  if(amount <= 0) return;
  player.exp += amount;
  addFloatText(player.x, player.y - P.h - 26, "EXP +" + amount, "#a3e635");
  while(player.exp >= expNeed(player.level)){
    player.exp -= expNeed(player.level);
    player.level++;
    trainStat("mag", 15, false);   // 레벨업: 학과(화염술사) 주 스탯 자동 보너스
    player.hp = maxHp(); player.mp = maxMp();
    addFloatText(player.x, player.y - P.h - 50, "LEVEL UP!  Lv." + player.level, "#fbbf24");
    juice.addShake(0.35); juice.addHitstop(0.08); juice.flash = 0.25;
    spawnParticles(player.x, player.y - P.h/2, { n: 30, col: ["#fbbf24","#fde68a","#fff"], sp0: 80, sp1: 340, l0: .4, l1: .9, add: true, grav: -60 });
  }
}

// ============================== PROJECTILES ==============================
const projectiles = [];

function fireBolt(){
  const pl = player;
  const dmg = Math.floor(irand(SKILL.bolt.dmg[0], SKILL.bolt.dmg[1]) * magMul());
  pl.castT = 0.16;
  projectiles.push({
    type: "bolt", x: pl.x + pl.facing*26, y: pl.y - 56,
    vx: pl.facing * SKILL.bolt.speed, r: 6, dmg,
    dist: 0, maxDist: SKILL.bolt.range, kb: 90,
    hitstop: 0.025, shake: 0.06,
  });
  pl.vx -= pl.facing * 20;   // 소소한 반동
  spawnParticles(pl.x + pl.facing*26, pl.y - 56, { n: 4, col: ["#ffb35c","#ffe08a"], ang: pl.facing>0?0:Math.PI, spread: .5, sp0: 60, sp1: 160, l0: .1, l1: .25, add: true });
}

function fireFireball(t){    // t: 0~1 차지 비율
  const pl = player;
  const base = irand(SKILL.fireball.dmg[0], SKILL.fireball.dmg[1]);
  const dmg = Math.floor(base * lerp(1, SKILL.fireball.dmgMaxMul, t) * magMul());
  pl.castT = 0.22;
  projectiles.push({
    type: "fireball", x: pl.x + pl.facing*30, y: pl.y - 56,
    vx: pl.facing * SKILL.fireball.speed, r: lerp(9, 18, t), dmg,
    dist: 0, maxDist: 640, kb: lerp(140, 320, t),
    aoe: lerp(46, 110, t), charge: t,
    hitstop: lerp(0.04, 0.11, t), shake: lerp(0.15, 0.5, t),
  });
  pl.vx -= pl.facing * lerp(40, 160, t);   // 반동
  juice.addShake(0.08 + t*0.1);
  spawnParticles(pl.x + pl.facing*30, pl.y - 56, { n: 8 + Math.floor(t*8), col: ["#ff7b3a","#ffd27f"], ang: pl.facing>0?0:Math.PI, spread: .6, sp0: 80, sp1: 260, l0: .15, l1: .3, add: true });
}

function updateProjectiles(dt){
  for(let i=projectiles.length-1;i>=0;i--){
    const pr = projectiles[i];
    pr.x += pr.vx*dt;
    pr.dist += Math.abs(pr.vx)*dt;
    // 화염 꼬리
    if(pr.type === "fireball" || Math.random() < 0.4){
      spawnParticles(pr.x, pr.y, { n: 1, col: pr.type==="fireball"?["#ff7b3a","#ffb35c"]:["#ffd27f"], sp0: 5, sp1: 40, l0: .1, l1: .28, add: true, r0: 2, r1: pr.type==="fireball"?5:3 });
    }
    let hit = false;
    for(const m of monsters){
      if(m.dead) continue;
      const r = mobRect(m);
      if(pr.x + pr.r > r.x && pr.x - pr.r < r.x + r.w && pr.y + pr.r > r.y && pr.y - pr.r < r.y + r.h){
        hit = true;
        if(pr.type === "fireball") explodeFireball(pr);
        else hitMonster(m, pr.dmg, pr.kb * sign(pr.vx), pr);
        break;
      }
    }
    if(hit || pr.dist >= pr.maxDist || pr.x < -40 || pr.x > MAP_W + 40){
      if(!hit && pr.type === "fireball") explodeFireball(pr);   // 사거리 끝 자폭
      projectiles.splice(i,1);
    }
  }
}

function explodeFireball(pr){
  juice.addShake(pr.shake); juice.addHitstop(pr.hitstop);
  spawnParticles(pr.x, pr.y, { n: 14 + Math.floor(pr.charge*18), col: ["#ff7b3a","#ffb35c","#ffe08a","#fff"], sp0: 100, sp1: 200 + pr.charge*260, l0: .2, l1: .5, add: true });
  spawnParticles(pr.x, pr.y, { n: 6, col: "#4b5563", sp0: 30, sp1: 90, l0: .3, l1: .7, grav: -40, r0: 4, r1: 8 });
  explosions.push({ x: pr.x, y: pr.y, r: pr.aoe, t: 0, life: 0.22 });
  let hitAny = false;
  for(const m of monsters){
    if(m.dead) continue;
    const r = mobRect(m);
    const cx = r.x + r.w/2, cy = r.y + r.h/2;
    const d = Math.hypot(cx - pr.x, cy - pr.y);
    if(d <= pr.aoe + Math.max(r.w, r.h)/2){
      hitMonster(m, pr.dmg, pr.kb * sign(cx - pr.x || pr.vx), pr);
      hitAny = true;
    }
  }
  if(hitAny && pr.charge >= 0.999){
    questEvent("maxChargeHit");      // 폭발당 1회
    trainStat("wil", 1.0, true);     // 행동 성장: 집중 유지
  }
}
const explosions = [];

const monsters = [];
function spawnMob(type, x, patrolMin, patrolMax){

  monsters.push({
    type, x, y: GROUND_Y, vx: 0, dir: Math.random()<0.5?-1:1,

    spawnX: x, dead: false, respawn: 0,

  });
}
// 배치: 허수아비(연습) → 슬라임 → 버섯
spawnMob("dummy", 700);
spawnMob("dummy", 790);
spawnMob("slime", 1560, 1500, 1720);
spawnMob("slime", 1840, 1760, 1980);
spawnMob("slime", 2120, 2020, 2260);
spawnMob("slime", 2320, 2240, 2440);

spawnMob("mushroom", 2820, 2740, 2960);
spawnMob("mushroom", 3080, 3000, 3220);

const BOSS_M = monsters[monsters.length - 1];

// ============================== 보스: 학기말 실기 시험 ==============================
// windup(예고) → 실행 → 회복 루프, HP 50% 이하 2페이즈 (기획서 §8.6)
const boss = { active: false, defeated: false, state: "wait", t: 1.2, chargeDir: 1 };
const spikes = [];   // 뿌리 가시 경고→분출
const eprojs = [];   // 씨앗 투사체 (적 탄환)
function bossReady(){ return questState.idx >= 4 || questState.doneAll; }
function bossPhase2(){ return BOSS_M.hp <= BOSS_M.maxHp * 0.5; }

function resetBoss(){
  boss.active = false; boss.state = "wait"; boss.t = 1.2;
  BOSS_M.hp = BOSS_M.maxHp; BOSS_M.x = BOSS_M.spawnX; BOSS_M.kbVx = 0;
  spikes.length = 0; eprojs.length = 0;
}

function updateBoss(dt){
  const m = BOSS_M;
  if(boss.defeated || m.dead) return;
  const pl = player;
  // 입장 감지
  if(!boss.active){
    if(bossReady() && !pl.dead && pl.x > ARENA_L + 40){
      boss.active = true; boss.state = "wait"; boss.t = 1.6;
      questBanner("학기말 실기 시험 개시!", `${MOB_DEFS.boss.name}을(를) 쓰러뜨려라`, "몸이 하얗게 빛나면 공격 예고 — 대시(Shift)로 회피!");
      juice.addShake(0.4);
    }
    return;
  }
  if(pl.dead){ resetBoss(); return; }

  const p2 = bossPhase2();
  m.dir = sign(pl.x - m.x);
  boss.t -= dt;
  switch(boss.state){
    case "wait":
      if(boss.t <= 0){
        const r = Math.random();
        boss.state = r < 0.4 ? "windup_charge" : r < 0.75 ? "windup_spike" : "windup_seed";
        boss.t = p2 ? 0.5 : 0.7;   // 예고 시간 (공정한 회피 창)
      }
      break;
    case "windup_charge": case "windup_spike": case "windup_seed":
      if(boss.t <= 0){
        if(boss.state === "windup_charge"){
          boss.state = "charge"; boss.t = 1.0; boss.chargeDir = m.dir;
          juice.addShake(0.15);
        }else if(boss.state === "windup_spike"){
          boss.state = "recover"; boss.t = 0.9;
          spawnSpikes(p2 ? 3 : 2);
          juice.addShake(0.35);
        }else{
          boss.state = "recover"; boss.t = 0.8;
          throwSeeds(p2 ? 4 : 3);
        }
      }
      break;
    case "charge":
      m.x += boss.chargeDir * (p2 ? 620 : 500) * dt;
      if(Math.random() < 0.6)
        spawnParticles(m.x - boss.chargeDir*44, m.y - 16, { n: 1, col: ["#5e7a4a","#8a683d"], sp0: 30, sp1: 110, l0: .2, l1: .4, grav: 300 });
      if(m.x < ARENA_L + 70 || m.x > ARENA_R - 70 || boss.t <= 0){
        boss.state = "recover"; boss.t = p2 ? 0.5 : 0.8;
        juice.addShake(0.25);
      }
      break;
    case "recover":
      if(boss.t <= 0){ boss.state = "wait"; boss.t = p2 ? rand(0.6, 1.0) : rand(1.0, 1.5); }
      break;
  }
  m.x = clamp(m.x, ARENA_L + 60, ARENA_R - 60);
}

function spawnSpikes(n){
  const xs = [player.x];
  for(let i = 1; i < n; i++) xs.push(player.x + (i % 2 ? -1 : 1) * Math.ceil(i/2) * 140);
  for(const sx of xs) spikes.push({ x: clamp(sx, ARENA_L + 40, ARENA_R - 40), warn: 0.75, active: 0 });
}
function updateSpikes(dt){
  for(let i = spikes.length - 1; i >= 0; i--){
    const s = spikes[i];
    if(s.warn > 0){
      s.warn -= dt;
      if(s.warn <= 0){
        s.active = 0.45;
        juice.addShake(0.22);
        spawnParticles(s.x, GROUND_Y, { n: 10, col: ["#7a9b5e","#4a6741","#8a683d"], sp0: 60, sp1: 240, l0: .2, l1: .5, grav: 500 });
      }
    }else{
      s.active -= dt;
      if(s.active > 0.12 && !player.dead && Math.abs(player.x - s.x) < 46 && player.y > GROUND_Y - 72){
        hurtPlayer(15, s.x + (player.x < s.x ? 40 : -40));
      }
      if(s.active <= 0) spikes.splice(i, 1);
    }
  }
}
function throwSeeds(n){
  const m = BOSS_M;
  for(let i = 0; i < n; i++){
    const tx = player.x + rand(-70, 70);
    const t0 = rand(0.75, 1.05);
    const sx = m.x, sy = m.y - 92;
    eprojs.push({ x: sx, y: sy, vx: (tx - sx)/t0, vy: (GROUND_Y - sy - 0.5*GRAV*t0*t0)/t0, r: 9 });
  }
}
function updateEprojs(dt){
  for(let i = eprojs.length - 1; i >= 0; i--){
    const e = eprojs[i];
    e.vy += GRAV * dt; e.x += e.vx * dt; e.y += e.vy * dt;
    const pr = playerRect();
    if(!player.dead && e.x > pr.x - e.r && e.x < pr.x + pr.w + e.r && e.y > pr.y - e.r && e.y < pr.y + pr.h + e.r){
      hurtPlayer(12, e.x - sign(e.vx) * 30);
      eprojs.splice(i, 1); continue;
    }
    if(e.y >= GROUND_Y){
      spawnParticles(e.x, GROUND_Y, { n: 6, col: ["#7a9b5e","#a3e635"], sp0: 40, sp1: 160, l0: .2, l1: .4, grav: 400 });
      eprojs.splice(i, 1);
    }
  }
}

function mobRect(m){
  const d = MOB_DEFS[m.type];
  return { x: m.x - d.w/2, y: m.y - d.h, w: d.w, h: d.h };
}

function updateMonsters(dt){
  for(const m of monsters){
    const d = MOB_DEFS[m.type];
    m.animT += dt;
    if(m.dead){
      m.respawn -= dt;
      if(m.respawn <= 0 && m.type !== "dummy" && m.type !== "boss"){
        m.dead = false; m.hp = m.maxHp; m.x = m.spawnX; m.y = GROUND_Y;
        m.kbVx = 0; m.hpBarTimer = 0;
        spawnParticles(m.x, m.y - d.h/2, { n: 8, col: "#a78bfa", sp0: 40, sp1: 140, l0: .2, l1: .5, add: true });
      }
      continue;
    }
    m.hurtFlash = Math.max(0, m.hurtFlash - dt);
    m.hpBarTimer = Math.max(0, m.hpBarTimer - dt);

    // 넉백 감쇠
    if(Math.abs(m.kbVx) > 1){
      m.x += m.kbVx * dt;
      m.kbVx *= Math.pow(0.0018, dt);   // 빠른 감쇠
    }else m.kbVx = 0;

    if(d.speed > 0){
      // 순찰 AI
      m.x += m.dir * d.speed * dt;
      if(m.x < m.patrolMin){ m.x = m.patrolMin; m.dir = 1; }
      if(m.x > m.patrolMax){ m.x = m.patrolMax; m.dir = -1; }
      // 슬라임 점프
      if(m.type === "slime"){
        m.hopTimer -= dt;
        if(m.onGround && m.hopTimer <= 0){
          m.vy = -420; m.onGround = false; m.hopTimer = rand(1.2, 2.8);
        }
      }
      if(!m.onGround){
        m.vy += GRAV * dt;
        m.y += m.vy * dt;
        if(m.y >= GROUND_Y){ m.y = GROUND_Y; m.vy = 0; m.onGround = true; }
      }
    }
    m.x = clamp(m.x, 40, MAP_W - 40);

    // 접촉 데미지
    if(d.contact && !player.dead){
      const pr = playerRect(), r = mobRect(m);
      if(pr.x < r.x + r.w && pr.x + pr.w > r.x && pr.y < r.y + r.h && pr.y + pr.h > r.y){
        hurtPlayer(d.dmg, m.x);
      }
    }
  }
}

function hitMonster(m, baseDmg, kb, pr){
  const d = MOB_DEFS[m.type];
  const crit = Math.random() < critChance();
  const dmg = Math.floor(baseDmg * (crit ? CRIT_MUL : 1));
  m.hp -= dmg;
  m.hurtFlash = 0.12;
  m.hpBarTimer = 3.0;
  m.kbVx = kb * (crit ? 1.4 : 1) * strMul() * (m.type === "boss" ? 0.07 : 1);   // 보스는 넉백 저항
  // 퀘스트·행동 성장 훅
  if(pr.type === "bolt"){ questEvent("boltHit"); trainStat("mag", 0.5, true); }
  if(pr.type === "fireball") trainStat("mag", 1.0, true);
  if(pr.type === "field" && lessonState.status === "active"){
    lessonState.prog++;
    if(lessonState.prog >= LESSON.need) lessonComplete();
  }
  const r = mobRect(m);
  addDmgNumber(r.x + r.w/2, r.y - 6, dmg, crit);
  combo.hit();
  juice.addShake((pr.shake ?? 0.08) * (crit ? 1.5 : 1));
  juice.addHitstop((pr.hitstop ?? 0.02) * (crit ? 1.6 : 1));
  spawnParticles(r.x + r.w/2, r.y + r.h/2, { n: crit ? 12 : 6, col: ["#ffb35c","#fff","#ffe08a"], sp0: 60, sp1: crit?300:180, l0: .15, l1: .4, add: true });
  if(m.hp <= 0 && m.type !== "dummy"){
    m.dead = true; m.respawn = RESPAWN_TIME;
    juice.addShake(0.2); juice.addHitstop(0.05);
    spawnParticles(m.x, m.y - d.h/2, { n: 18, col: [d.color, "#fff"], sp0: 80, sp1: 320, l0: .25, l1: .6, grav: 600 });
    gainExp(d.exp);
    questEvent("kill", m.type);
    trainStat("str", 1.5, true);   // 행동 성장: 전투 마무리
    if(m.type === "boss"){
      boss.defeated = true; boss.active = false;
      spikes.length = 0; eprojs.length = 0;
      juice.addHitstop(0.3); juice.addShake(1.0); juice.flash = 0.5;
      spawnParticles(m.x, m.y - 60, { n: 60, col: ["#7a9b5e","#a3e635","#fff","#fbbf24"], sp0: 100, sp1: 520, l0: .4, l1: 1.0, grav: 300 });
      questBanner("실기 시험 합격!", "숲의 수호자를 쓰러뜨렸다 — 1학기 수료!", "다음 업데이트에서 2학기로 계속");
      saveGame();
    }
  }
}

// ============================== UPDATE ==============================
let showHelp = true, showBook = false;
function update(dt){
  if(inp.helpP()) showHelp = !showHelp;
  if(inp.bookP()) showBook = !showBook;

  // --- 대화 / 상호작용 (E)
  if(dialog){
    if(pressed["e"] || pressed["z"] || pressed["space"]) advanceDialog();
  }else if(pressed["e"] && !player.dead && Math.abs(player.x - PROF.x) < 60){
    talkToProf();
  }

  // --- 자동 저장 / 초기화(F2 두 번)
  saveTimer -= dt;
  if(saveTimer <= 0){ saveTimer = 8; saveGame(); }
  if(pressed["F2"]){
    if(resetArm > 0){
      try{ localStorage.removeItem(SAVE_KEY); }catch(e){}
      location.reload();
    }else{
      resetArm = 3;
      addFloatText(player.x, player.y - P.h - 60, "저장 초기화 — 3초 안에 F2 한 번 더!", "#f87171");
    }
  }
  resetArm = Math.max(0, resetArm - dt);
  saveFlash = Math.max(0, saveFlash - dt);

  updatePlayer(dt);
  updateMonsters(dt);
  updateBoss(dt);
  updateSpikes(dt);
  updateEprojs(dt);
  updateProjectiles(dt);
  updateFields(dt);
  updateParticles(dt);
  combo.update(dt);
  for(let i=explosions.length-1;i>=0;i--){
    explosions[i].t += dt;
    if(explosions[i].t >= explosions[i].life) explosions.splice(i,1);
  }
  for(let i=dmgNumbers.length-1;i>=0;i--){
    const n = dmgNumbers[i]; n.t += dt;
    if(n.t >= n.life) dmgNumbers.splice(i,1);
  }
  for(let i=floatTexts.length-1;i>=0;i--){
    const f = floatTexts[i]; f.t += dt;
    if(f.t >= f.life) floatTexts.splice(i,1);
  }
  for(let i=rankBanners.length-1;i>=0;i--){
    rankBanners[i].t += dt;
    if(rankBanners[i].t >= rankBanners[i].life) rankBanners.splice(i,1);
  }
  if(questState.banner){
    questState.banner.t += dt;
    if(questState.banner.t >= questState.banner.life) questState.banner = null;
  }
  juice.trauma = Math.max(0, juice.trauma - dt*1.6);
  juice.flash = Math.max(0, juice.flash - dt*2);
  // 입력 엣지 클리어
  for(const k in pressed) pressed[k] = false;
}

// ============================== RENDER ==============================
const cvs = document.getElementById("game");
const ctx = cvs.getContext("2d");
let camX = 0;

function render(){
  // 카메라
  const targetCam = clamp(player.x - VIEW_W/2, 0, MAP_W - VIEW_W);
  camX = lerp(camX, targetCam, 0.12);
  const sh = juice.shakeOffset();

  // --- 하늘 (저녁 숲)
  const sky = ctx.createLinearGradient(0, 0, 0, VIEW_H);
  sky.addColorStop(0, "#141a33");
  sky.addColorStop(0.6, "#23294d");
  sky.addColorStop(1, "#31294a");
  ctx.fillStyle = sky;
  ctx.fillRect(0, 0, VIEW_W, VIEW_H);

  // 달
  ctx.fillStyle = "#e9e6ff";
  ctx.beginPath(); ctx.arc(1080 - camX*0.05, 110, 38, 0, Math.PI*2); ctx.fill();
  ctx.fillStyle = "#141a33";
  ctx.beginPath(); ctx.arc(1094 - camX*0.05, 100, 34, 0, Math.PI*2); ctx.fill();

  ctx.save();
  ctx.translate(sh.x, sh.y);

  // --- 배경 나무 (패럴럭스)
  for(const t of bgTrees){
    const par = t.layer === 0 ? 0.35 : 0.6;
    const x = t.x - camX * par;
    if(x < -120 || x > VIEW_W + 120) continue;
    ctx.fillStyle = t.layer === 0 ? "#1a2140" : "#252c52";
    ctx.fillRect(x - 8, GROUND_Y - t.h, 16, t.h);            // 줄기
    ctx.beginPath();
    ctx.moveTo(x - 46, GROUND_Y - t.h + 30);
    ctx.lineTo(x, GROUND_Y - t.h - 70);
    ctx.lineTo(x + 46, GROUND_Y - t.h + 30);
    ctx.closePath(); ctx.fill();                              // 잎
  }

  ctx.translate(-camX, 0);

  // --- 지형
  for(const pf of platforms){
    if(pf.solidGround){
      ctx.fillStyle = "#2d3b2d";
      ctx.fillRect(pf.x, pf.y, pf.w, pf.h);
      ctx.fillStyle = "#4a6741";
      ctx.fillRect(pf.x, pf.y, pf.w, 10);                     // 잔디
    }else{
      ctx.fillStyle = "#5b4636";
      ctx.fillRect(pf.x, pf.y, pf.w, pf.h);
      ctx.fillStyle = "#7a9b5e";
      ctx.fillRect(pf.x, pf.y, pf.w, 5);
    }
  }

  // --- 안내판
  ctx.textAlign = "center";
  for(const s of signs){
    ctx.fillStyle = "#6b4f2e";
    ctx.fillRect(s.x - 4, GROUND_Y - 46, 8, 46);
    ctx.fillStyle = "#8a683d";
    const tw = ctx.measureText(s.text).width;
    ctx.font = "bold 15px sans-serif";
    const w = Math.max(140, ctx.measureText(s.text).width + 24);
    ctx.fillRect(s.x - w/2, GROUND_Y - 88, w, 40);
    ctx.strokeStyle = "#5b4426"; ctx.lineWidth = 3;
    ctx.strokeRect(s.x - w/2, GROUND_Y - 88, w, 40);
    ctx.fillStyle = "#fdf2d0";
    ctx.fillText(s.text, s.x, GROUND_Y - 63);
  }

  // --- 화염 장판
  for(const f of fields){
    const flick = 0.75 + Math.sin(f.t*30)*0.15;
    const fade = f.t > SKILL.field.dur - 0.5 ? (SKILL.field.dur - f.t)/0.5 : 1;
    ctx.save();
    ctx.globalCompositeOperation = "lighter";
    ctx.globalAlpha = 0.55 * flick * fade;
    const fg = ctx.createLinearGradient(0, f.y - 34, 0, f.y);
    fg.addColorStop(0, "rgba(255,140,40,0)");
    fg.addColorStop(1, "#ff8c3a");
    ctx.fillStyle = fg;
    ctx.fillRect(f.x - f.w/2, f.y - 34, f.w, 34);
    ctx.restore();
  }

  // --- 시험장 가시문 / 아레나 벽
  if(!boss.defeated && !bossReady()){
    drawThornWall(GATE_X);
    ctx.textAlign = "center";
    ctx.font = "bold 13px sans-serif"; ctx.fillStyle = "#f0abfc";
    ctx.fillText("시험 자격 필요 — 퀘스트를 모두 완료하자", GATE_X, GROUND_Y - 190);
  }
  if(boss.active && !BOSS_M.dead){
    drawThornWall(ARENA_L);
    drawThornWall(ARENA_R);
  }

  // --- 뿌리 가시 (경고 → 분출)
  for(const s of spikes){
    if(s.warn > 0){
      const pulse = 0.35 + Math.abs(Math.sin(performance.now()/90)) * 0.35;
      ctx.fillStyle = `rgba(239,68,68,${pulse})`;
      ctx.fillRect(s.x - 46, GROUND_Y - 6, 92, 6);
      ctx.textAlign = "center";
      ctx.font = "bold 18px sans-serif"; ctx.fillStyle = "#ef4444";
      ctx.fillText("!", s.x, GROUND_Y - 14);
    }else if(s.active > 0){
      const hgt = 72 * Math.min(1, s.active / 0.32);
      ctx.fillStyle = "#5e7a4a";
      for(let ti = -1; ti <= 1; ti++){
        ctx.beginPath();
        ctx.moveTo(s.x + ti*26 - 12, GROUND_Y);
        ctx.lineTo(s.x + ti*26, GROUND_Y - hgt * (ti === 0 ? 1 : 0.7));
        ctx.lineTo(s.x + ti*26 + 12, GROUND_Y);
        ctx.closePath(); ctx.fill();
      }
    }
  }

  // --- 씨앗 투사체
  for(const e of eprojs){
    ctx.save();
    ctx.globalCompositeOperation = "lighter";
    const eg = ctx.createRadialGradient(e.x, e.y, 0, e.x, e.y, e.r*2);
    eg.addColorStop(0, "#d9f99d");
    eg.addColorStop(0.5, "#84cc16");
    eg.addColorStop(1, "rgba(90,140,40,0)");
    ctx.fillStyle = eg;
    ctx.beginPath(); ctx.arc(e.x, e.y, e.r*2, 0, Math.PI*2); ctx.fill();
    ctx.restore();
  }

  // --- 교수 NPC
  drawProfessor();

  // --- 몬스터
  for(const m of monsters){
    if(m.dead) continue;
    const d = MOB_DEFS[m.type];
    const r = mobRect(m);
    const squish = m.type === "slime" ? Math.sin(m.animT * 6) * 3 : 0;
    ctx.fillStyle = m.hurtFlash > 0 ? "#ffffff" : d.color;
    if(m.type === "boss"){
      // 예고(windup) 점멸 — 공정한 회피 신호
      const tele = boss.active && boss.state.startsWith("windup") && Math.floor(performance.now()/90) % 2 === 0;
      const p2 = bossPhase2();
      const flash = m.hurtFlash > 0 || tele;
      const sway = Math.sin(m.animT * 1.6) * 3;
      // 몸통(고목 줄기)
      ctx.fillStyle = flash ? "#fff" : "#4a3b28";
      ctx.fillRect(m.x - 30, m.y - d.h + 26, 60, d.h - 26);
      // 팔
      ctx.fillStyle = flash ? "#fff" : "#3d3122";
      ctx.fillRect(m.x - 30 - 18, m.y - d.h + 44 + sway, 20, 54);
      ctx.fillRect(m.x + 30 - 2,  m.y - d.h + 44 - sway, 20, 54);
      // 수관(잎 머리)
      ctx.fillStyle = flash ? "#fff" : (p2 ? "#6b8747" : d.color);
      ctx.beginPath();
      ctx.ellipse(m.x, m.y - d.h + 18, 52, 30, 0, 0, Math.PI*2);
      ctx.fill();
      // 눈 (2페이즈: 붉게 발광)
      ctx.save();
      if(p2) ctx.globalCompositeOperation = "lighter";
      ctx.fillStyle = p2 ? "#ff5040" : "#ffd93d";
      ctx.fillRect(m.x - 14 + m.dir*4, m.y - d.h + 40, 8, 9);
      ctx.fillRect(m.x + 6 + m.dir*4,  m.y - d.h + 40, 8, 9);
      ctx.restore();
      // 균열(체력 낮을수록)
      if(m.hp < m.maxHp * 0.75){
        ctx.strokeStyle = "rgba(255,220,120,.5)"; ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.moveTo(m.x - 10, m.y - 60); ctx.lineTo(m.x + 2, m.y - 40); ctx.lineTo(m.x - 6, m.y - 20);
        ctx.stroke();
      }
    }else if(m.type === "dummy"){
      // 허수아비: 기둥 + 머리
      ctx.fillStyle = "#7a5a33";
      ctx.fillRect(m.x - 5, m.y - d.h, 10, d.h);
      ctx.fillStyle = m.hurtFlash > 0 ? "#fff" : "#c8a35f";
      ctx.fillRect(m.x - 16, m.y - d.h, 32, 26);
      ctx.fillStyle = "#3a2c17";
      ctx.fillRect(m.x - 10, m.y - d.h + 8, 5, 5);
      ctx.fillRect(m.x + 5,  m.y - d.h + 8, 5, 5);
    }else if(m.type === "slime"){
      ctx.beginPath();
      ctx.ellipse(m.x, m.y - d.h/2, d.w/2 + squish, d.h/2 - squish*0.6, 0, 0, Math.PI*2);
      ctx.fill();
      ctx.fillStyle = "#111";
      ctx.fillRect(m.x - 8 + m.dir*3, m.y - d.h/2 - 4, 4, 6);
      ctx.fillRect(m.x + 4 + m.dir*3, m.y - d.h/2 - 4, 4, 6);
    }else{
      // 버섯: 몸통 + 갓
      ctx.fillStyle = m.hurtFlash > 0 ? "#fff" : "#e8d8b0";
      ctx.fillRect(r.x + 6, r.y + 14, d.w - 12, d.h - 14);
      ctx.fillStyle = m.hurtFlash > 0 ? "#fff" : d.color;
      ctx.beginPath();
      ctx.ellipse(m.x, r.y + 12, d.w/2 + 6, 14, 0, Math.PI, 0);
      ctx.fill();
      ctx.fillStyle = "#111";
      ctx.fillRect(m.x - 8 + m.dir*3, r.y + 20, 4, 6);
      ctx.fillRect(m.x + 4 + m.dir*3, r.y + 20, 4, 6);
    }
    // HP바 (보스는 상단 대형 바 사용)
    if(m.hpBarTimer > 0 && m.type !== "dummy" && m.type !== "boss"){
      const bw = 44;
      ctx.fillStyle = "rgba(0,0,0,.6)";
      ctx.fillRect(m.x - bw/2, r.y - 14, bw, 6);
      ctx.fillStyle = "#ef4444";
      ctx.fillRect(m.x - bw/2, r.y - 14, bw * clamp(m.hp / m.maxHp, 0, 1), 6);
    }
  }

  // --- 플레이어
  drawPlayer();

  // --- 투사체
  for(const pr of projectiles){
    ctx.save();
    ctx.globalCompositeOperation = "lighter";
    const g = ctx.createRadialGradient(pr.x, pr.y, 0, pr.x, pr.y, pr.r*2.2);
    g.addColorStop(0, "#fff3d6");
    g.addColorStop(0.4, "#ffb35c");
    g.addColorStop(1, "rgba(255,100,30,0)");
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.arc(pr.x, pr.y, pr.r*2.2, 0, Math.PI*2); ctx.fill();
    ctx.restore();
  }

  // --- 폭발 링
  for(const e of explosions){
    const k = e.t / e.life;
    ctx.save();
    ctx.globalCompositeOperation = "lighter";
    ctx.strokeStyle = `rgba(255,170,80,${1-k})`;
    ctx.lineWidth = 6 * (1-k) + 2;
    ctx.beginPath(); ctx.arc(e.x, e.y, e.r * (0.4 + k*0.6), 0, Math.PI*2); ctx.stroke();
    ctx.restore();
  }

  // --- 파티클
  for(const p of particles){
    const k = 1 - p.t / p.life;
    ctx.save();
    if(p.add) ctx.globalCompositeOperation = "lighter";
    ctx.globalAlpha = k;
    ctx.fillStyle = p.col;
    ctx.beginPath(); ctx.arc(p.x, p.y, p.r * k, 0, Math.PI*2); ctx.fill();
    ctx.restore();
  }

  // --- 데미지 넘버
  for(const n of dmgNumbers){
    const k = n.t / n.life;
    const y = n.y - k*46;
    const scale = n.crit ? (k < 0.15 ? lerp(1.8, 1.2, k/0.15) : 1.2) : 1;
    ctx.save();
    ctx.globalAlpha = 1 - k*k;
    ctx.font = `bold ${Math.floor((n.crit?26:19)*scale)}px sans-serif`;
    ctx.textAlign = "center";
    ctx.lineWidth = 4; ctx.strokeStyle = "rgba(0,0,0,.7)";
    ctx.strokeText(n.val, n.x, y);
    ctx.fillStyle = n.crit ? "#ffb020" : "#ffe9c9";
    ctx.fillText(n.val, n.x, y);
    ctx.restore();
  }

  // --- 플로팅 텍스트
  for(const f of floatTexts){
    const k = f.t / f.life;
    ctx.save();
    ctx.globalAlpha = 1 - k*k;
    ctx.font = "bold 17px sans-serif";
    ctx.textAlign = "center";
    ctx.lineWidth = 4; ctx.strokeStyle = "rgba(0,0,0,.7)";
    ctx.strokeText(f.text, f.x, f.y - k*40);
    ctx.fillStyle = f.col;
    ctx.fillText(f.text, f.x, f.y - k*40);
    ctx.restore();
  }

  ctx.restore();   // 카메라/셰이크 해제

  // --- 화면 플래시
  if(juice.flash > 0){
    ctx.fillStyle = `rgba(255,240,200,${juice.flash})`;
    ctx.fillRect(0, 0, VIEW_W, VIEW_H);
  }
  // 피격 비네트
  if(player.hurtFlash > 0){
    ctx.fillStyle = `rgba(220,40,40,${player.hurtFlash * 0.5})`;
    ctx.fillRect(0, 0, VIEW_W, VIEW_H);
  }

  renderHUD();
}

function drawThornWall(x){
  ctx.fillStyle = "#3d4d2e";
  ctx.fillRect(x - 7, GROUND_Y - 170, 14, 170);
  ctx.fillStyle = "#5e7a4a";
  for(let i = 0; i < 6; i++){
    const wy = GROUND_Y - 20 - i*28;
    const dirn = i % 2 ? 1 : -1;
    ctx.beginPath();
    ctx.moveTo(x, wy);
    ctx.lineTo(x + dirn*26, wy - 10);
    ctx.lineTo(x, wy - 18);
    ctx.closePath(); ctx.fill();
  }
}

function drawProfessor(){
  const x = PROF.x, y = GROUND_Y;
  // 로브 (보라)
  ctx.fillStyle = "#5b3a8f";
  ctx.fillRect(x - 16, y - 52, 32, 52);
  ctx.fillStyle = "#472c73";
  ctx.fillRect(x - 16, y - 12, 32, 12);
  // 머리 + 수염
  ctx.fillStyle = "#e8c9a0";
  ctx.fillRect(x - 10, y - 66, 20, 16);
  ctx.fillStyle = "#d1d5db";
  ctx.fillRect(x - 8, y - 52, 16, 7);
  // 모자
  ctx.fillStyle = "#3b2566";
  ctx.beginPath();
  ctx.moveTo(x - 18, y - 64); ctx.lineTo(x + 18, y - 64); ctx.lineTo(x, y - 92);
  ctx.closePath(); ctx.fill();
  // 눈
  ctx.fillStyle = "#1c1c28";
  ctx.fillRect(x - 5, y - 61, 3, 4); ctx.fillRect(x + 2, y - 61, 3, 4);
  // 상태 아이콘 (! 수업 가능 / ? 과제 중)
  ctx.textAlign = "center";
  const bob = Math.sin(performance.now()/300)*4;
  if(lessonState.status === "avail"){
    ctx.font = "bold 24px sans-serif"; ctx.fillStyle = "#fbbf24";
    ctx.fillText("!", x, y - 102 + bob);
  }else if(lessonState.status === "active"){
    ctx.font = "bold 20px sans-serif"; ctx.fillStyle = "#8be9fd";
    ctx.fillText("?", x, y - 102 + bob);
  }
  // 이름표
  ctx.font = "11px sans-serif"; ctx.fillStyle = "#c4b5fd";
  ctx.fillText(PROF.name, x, y + 16);
  // E 프롬프트
  if(!dialog && !player.dead && Math.abs(player.x - x) < 60){
    ctx.fillStyle = "rgba(10,12,24,.8)";
    roundRect(x - 32, y - 134, 64, 22, 6); ctx.fill();
    ctx.font = "bold 13px sans-serif"; ctx.fillStyle = "#8be9fd";
    ctx.fillText("E 대화", x, y - 118);
  }
}

// ============================== 플레이어 스프라이트 시트 (도트) ==============================
// 제공된 화염 마법사 캐릭터(빨간 마녀모자·분홍 머리·화염 오브 지팡이)를 코드로 도트 재현.
// 12프레임: idle 2 / run 4 / jump / fall / cast 2 / charge / hurt — 우측 기준, 좌측은 미러링
const MAGE = {
  w: 34, h: 46, scale: 1.5,
  frames: { idle:[0,1], run:[2,3,4,5], jump:[6], fall:[7], cast:[8,9], charge:[10], hurt:[11] },
};
const mageSheet = document.createElement("canvas");
mageSheet.width = MAGE.w * 12; mageSheet.height = MAGE.h;
(function buildMageSheet(){
  const g = mageSheet.getContext("2d");
  const PAL = {
    hat:"#c53030", hatD:"#8c1f26", gold:"#f2b23c",
    flame:"#ff7b2e", flameY:"#ffd23e",
    hair:"#f2839f", hairD:"#c9536f",
    skin:"#ffdcb0", eye:"#3f9df0", eyeD:"#1d5fb0",
    robe:"#d43a2c", robeD:"#9c2420",
    wood:"#b46a2a", woodD:"#7d4418",
    boot:"#7a3a22", bootD:"#4f2413",
  };
  function px(f,x,y,w,h,c){ g.fillStyle = c; g.fillRect(f*MAGE.w + x, y, w, h); }
  function drawMage(f,o){
    o = Object.assign({bob:0,lean:0,lF:0,lB:0,liftF:0,liftB:0,tuck:0,cast:0,up:0,hurt:0,flick:0,big:0}, o);
    const b = o.bob, L = o.lean;
    const fl  = o.flick ? PAL.flameY : PAL.flame;
    const fl2 = o.flick ? PAL.flame : PAL.flameY;
    // 뒷머리 (왼쪽 긴 머리)
    px(f,5,17+b,4,13,PAL.hairD); px(f,6,17+b,2,11,PAL.hair);
    // 다리/부츠
    if(o.tuck){
      px(f,12,36,10,6,PAL.boot); px(f,12,41,10,2,PAL.bootD);
    }else{
      px(f,12+o.lF,38-o.liftF,5,8,PAL.boot); px(f,12+o.lF,44-o.liftF,5,2,PAL.bootD);
      px(f,19+o.lB,38-o.liftB,5,8,PAL.boot); px(f,19+o.lB,44-o.liftB,5,2,PAL.bootD);
    }
    // 로브(몸)
    px(f,12+L,23+b,10,4,PAL.robe);
    px(f,11+L,27+b,12,4,PAL.robe);
    px(f,10,31+b,14,4,PAL.robe);
    px(f,9,35+b,16,3,PAL.robe);
    px(f,20+L,24+b,2,13,PAL.robeD);        // 우측 음영
    px(f,12+L,23+b,10,1,PAL.gold);          // 옷깃
    px(f,11+L,27+b,12,1,PAL.gold);          // 벨트
    px(f,9,37+b,16,1,PAL.gold);             // 밑단 금테
    // 밑단 화염 무늬
    px(f,11,35+b,2,2,fl); px(f,15,35+b,2,2,fl2); px(f,19,35+b,2,2,fl); px(f,22,35+b,2,2,fl2);
    // 뒷팔
    px(f,9+L,25+b,3,6,PAL.robeD); px(f,9+L,31+b,2,2,PAL.skin);
    // 머리(얼굴)
    px(f,9+L,15+b,16,10,PAL.skin);
    // 눈 (피격 시 감김)
    if(o.hurt){
      px(f,13+L,21+b,3,1,PAL.eyeD); px(f,19+L,21+b,3,1,PAL.eyeD);
    }else{
      px(f,13+L,19+b,3,4,PAL.eye); px(f,13+L,19+b,3,1,PAL.eyeD); px(f,14+L,20+b,1,1,"#fff");
      px(f,19+L,19+b,3,4,PAL.eye); px(f,19+L,19+b,3,1,PAL.eyeD); px(f,20+L,20+b,1,1,"#fff");
    }
    // 앞머리(핑크 뱅)
    px(f,8+L,14+b,18,3,PAL.hair);
    px(f,10+L,17+b,2,2,PAL.hair); px(f,14+L,17+b,2,1,PAL.hair);
    px(f,18+L,17+b,2,2,PAL.hair); px(f,22+L,17+b,2,1,PAL.hair);
    px(f,7+L,15+b,2,9,PAL.hair); px(f,25+L,15+b,2,8,PAL.hairD);
    // 모자 (빨간 마녀모자 + 금 밴드 + 화염 엠블럼)
    px(f,4+L,12+b,26,3,PAL.hatD);
    px(f,4+L,12+b,26,1,PAL.hat);
    px(f,8+L,9+b,18,3,PAL.hat);  px(f,22+L,9+b,4,3,PAL.hatD);
    px(f,11+L,6+b,13,3,PAL.hat); px(f,20+L,6+b,4,3,PAL.hatD);
    px(f,14+L,3+b,8,3,PAL.hat);
    px(f,17+L,1+b,5,2,PAL.hat);
    px(f,20+L,0+b,3,2,PAL.hatD);            // 꺾인 팁
    px(f,8+L,11+b,18,1,PAL.gold);           // 밴드
    px(f,15+L,8+b,4,3,fl); px(f,16+L,9+b,2,1,fl2);   // 화염 엠블럼
    // 지팡이
    const rodX = 26 + L + o.cast*2;
    const rodTop = 13 + b - o.up*4;
    px(f,rodX,rodTop,2,24,PAL.wood);
    px(f,rodX+1,rodTop,1,24,PAL.woodD);
    // 오브 (화염 구슬)
    const ox = rodX - 2, oy = Math.max(0, rodTop - 6);
    px(f,ox,oy,6,6,PAL.flame);
    px(f,ox+1,oy+1,4,4,fl);
    px(f,ox+2,oy+2,2,2,PAL.flameY);
    px(f,ox+2,oy+1,1,1,"#fff");
    px(f,ox-1,oy+2,1,2,PAL.gold); px(f,ox+6,oy+2,1,2,PAL.gold);
    if(o.big){ px(f,ox-1,oy-1,8,1,fl2); px(f,ox-1,oy+6,8,1,fl2); }
    // 앞팔 + 손 (지팡이 그립)
    px(f,21+L,25+b,3,3,PAL.robe);
    px(f,23+L,26+b,3,3,PAL.robeD);
    if(o.cast) px(f,24+L,27+b,3,2,PAL.robe);
    px(f,rodX-1,28+b-o.up*2,3,3,PAL.skin);
  }
  drawMage(0,{});
  drawMage(1,{bob:1,flick:1});
  drawMage(2,{lF:4,lB:-4,liftB:2,lean:1});
  drawMage(3,{lF:1,lB:-1,liftF:1,lean:1,bob:1,flick:1});
  drawMage(4,{lF:-4,lB:4,liftF:2,lean:1});
  drawMage(5,{lF:-1,lB:1,liftB:1,lean:1,bob:1,flick:1});
  drawMage(6,{tuck:1,up:1,bob:-1});
  drawMage(7,{lF:-2,lB:3,flick:1});
  drawMage(8,{cast:1,lean:1,flick:1});
  drawMage(9,{cast:1,bob:1});
  drawMage(10,{up:1,bob:1,flick:1,big:1});
  drawMage(11,{hurt:1,lean:-1,bob:1});
})();

const mageWhite = document.createElement("canvas");
mageWhite.width = mageSheet.width; mageWhite.height = mageSheet.height;
{

function drawMageSprite(sheet, frame, x, y, facing, alpha){
  ctx.save();
  ctx.imageSmoothingEnabled = false;
  ctx.globalAlpha = alpha;
  ctx.translate(x, y);
  ctx.scale(facing, 1);
  const w = MAGE.w * MAGE.scale, h = MAGE.h * MAGE.scale;
  ctx.drawImage(sheet, frame*MAGE.w, 0, MAGE.w, MAGE.h, -w/2, -h, w, h);
  ctx.restore();
}

function pickMageFrame(){
  const pl = player, F = MAGE.frames;
  if(pl.hurtFlash > 0.12) return F.hurt[0];
  if(pl.fbCharge >= 0) return F.charge[0];
  if(pl.castT > 0) return F.cast[pl.castT > 0.09 ? 0 : 1];
  if(pl.dashTimer > 0) return F.run[1];
  if(!pl.onGround) return pl.vy < 0 ? F.jump[0] : F.fall[0];
  if(Math.abs(pl.vx) > 40) return F.run[Math.floor(pl.animT * 10) % 4];
  return F.idle[Math.floor(pl.animT * 2.5) % 2];
}

function drawPlayer(){
  const pl = player;
  if(pl.dead){
    ctx.save();
    ctx.globalAlpha = clamp(pl.deadTimer / 2, 0, 1);
    ctx.fillStyle = "#94a3b8";
    ctx.fillRect(pl.x - P.w/2, pl.y - 14, P.w + 8, 14);
    ctx.restore();
    return;
  }
  // 대시 잔상 (스프라이트 고스트)
  for(const t of pl.trail){
    drawMageSprite(mageSheet, MAGE.frames.run[1], t.x, t.y, t.f, t.t / 0.22 * 0.35);
  }
  // 무적 점멸
  if(pl.iframes > 0 && Math.floor(pl.iframes * 12) % 2 === 0 && pl.dashTimer <= 0) return;

  const x = pl.x, y = pl.y;
  const fr = pickMageFrame();
  drawMageSprite(mageSheet, fr, x, y, pl.facing, 1);
  if(pl.hurtFlash > 0)
    drawMageSprite(mageWhite, fr, x, y, pl.facing, Math.min(1, pl.hurtFlash * 2.2));

  // 지팡이 오브 글로우 (차지 시 강화)
  const charging = pl.fbCharge >= 0;
  const chargeK = charging ? pl.fbCharge / SKILL.fireball.maxCharge : 0;
  const gx = x + pl.facing * 16, gy = y - 56;
  ctx.save();
  ctx.globalCompositeOperation = "lighter";
  const gr = 4 + chargeK * 10;
  const gg = ctx.createRadialGradient(gx, gy, 0, gx, gy, gr*2.2);
  gg.addColorStop(0, charging ? "#fff0c0" : "rgba(255,210,127,.75)");
  gg.addColorStop(1, "rgba(255,150,60,0)");
  ctx.fillStyle = gg;
  ctx.beginPath(); ctx.arc(gx, gy, gr*2.2, 0, Math.PI*2); ctx.fill();
  ctx.restore();

  ctx.save();
  // 차지 게이지
  if(charging){
    const k = clamp(pl.fbCharge / SKILL.fireball.maxCharge, 0, 1);
    ctx.fillStyle = "rgba(0,0,0,.6)";
    ctx.fillRect(x - 26, y - P.h - 30, 52, 8);
    ctx.fillStyle = k >= 1 ? "#ffd93d" : "#ff9d4d";
    ctx.fillRect(x - 26, y - P.h - 30, 52*k, 8);
    if(k >= 1){
      ctx.font = "bold 12px sans-serif"; ctx.textAlign = "center";
      ctx.fillStyle = "#ffd93d";
      ctx.fillText("MAX!", x, y - P.h - 36);
    }
  }
  ctx.restore();
}

    ctx.fillText("쓰러졌습니다...", VIEW_W/2, VIEW_H/2 - 10);
    ctx.font = "17px sans-serif"; ctx.fillStyle = "#cbd5e1";
    ctx.fillText("입학처에서 다시 깨어납니다", VIEW_W/2, VIEW_H/2 + 28);
  }

  // 버전 표기
  ctx.textAlign = "right";
  ctx.font = "11px sans-serif"; ctx.fillStyle = "rgba(148,163,184,.55)";
  ctx.fillText("아르카나 아카데미 프로토타입 v0.5 — 입문의 숲", VIEW_W - 14, 22);
  // 저장 표시
  if(saveFlash > 0){
    ctx.globalAlpha = Math.min(1, saveFlash);
    ctx.font = "12px sans-serif"; ctx.fillStyle = "#4ade80";
    ctx.fillText("✓ 자동 저장됨", VIEW_W - 14, VIEW_H - 14);
    ctx.globalAlpha = 1;
  }
  ctx.restore();
}

function renderBook(){
  const PW = 820, PH = 460;
  const px = (VIEW_W - PW)/2, py = (VIEW_H - PH)/2;
  ctx.save();
  ctx.fillStyle = "rgba(0,0,0,.55)";
  ctx.fillRect(0, 0, VIEW_W, VIEW_H);
  ctx.fillStyle = "rgba(14,17,32,.96)";
  roundRect(px, py, PW, PH, 14); ctx.fill();
  ctx.strokeStyle = "#475569"; ctx.lineWidth = 2;
  roundRect(px, py, PW, PH, 14); ctx.stroke();

  ctx.textAlign = "left";
  ctx.font = "bold 20px sans-serif"; ctx.fillStyle = "#8be9fd";
  ctx.fillText("학생 수첩", px + 28, py + 40);
  ctx.font = "13px sans-serif"; ctx.fillStyle = "#64748b";
  ctx.fillText("아르카나 아카데미 1학년 — 화염술 예과 (Tab: 닫기)", px + 130, py + 40);
  const ov = overallRank();
  ctx.textAlign = "right";
  ctx.font = "bold 17px sans-serif"; ctx.fillStyle = rankColor(ov);
  ctx.fillText(`종합 랭크  ${ov}`, px + PW - 28, py + 40);

  // ----- 좌: 스탯 랭크
  ctx.textAlign = "left";
  ctx.font = "bold 15px sans-serif"; ctx.fillStyle = "#e2e8f0";
  ctx.fillText("능력 평가", px + 28, py + 78);
  const keys = Object.keys(STAT_DEFS);
  keys.forEach((k, i)=>{
    const st = player.stats[k], def = STAT_DEFS[k];
    const rank = RANKS[st.r];
    const ry = py + 100 + i*66;
    // 이름·설명
    ctx.font = "bold 15px sans-serif"; ctx.fillStyle = "#e2e8f0";
    ctx.fillText(def.name, px + 28, ry + 16);
    ctx.font = "11px sans-serif"; ctx.fillStyle = "#64748b";
    ctx.fillText(def.desc, px + 28, ry + 33);
    // 랭크 배지
    ctx.fillStyle = "rgba(0,0,0,.4)";
    roundRect(px + 190, ry - 2, 58, 30, 7); ctx.fill();
    ctx.strokeStyle = rankColor(rank); ctx.lineWidth = 2;
    roundRect(px + 190, ry - 2, 58, 30, 7); ctx.stroke();
    ctx.textAlign = "center";
    ctx.font = "bold 17px sans-serif"; ctx.fillStyle = rankColor(rank);
    ctx.fillText(rank, px + 219, ry + 19);
    ctx.textAlign = "left";
    // 수련치 눈금 (숫자 비노출 — ◆ 10칸)
    const need = RANK_NEED[st.r];
    const fill = need === Infinity ? 10 : Math.floor(clamp(st.tp / need, 0, 1) * 10);
    for(let c=0;c<10;c++){
      ctx.fillStyle = c < fill ? rankColor(rank) : "rgba(100,116,139,.35)";
      const cx = px + 264 + c*13;
      ctx.beginPath();
      ctx.moveTo(cx, ry + 8); ctx.lineTo(cx + 5, ry + 14);
      ctx.lineTo(cx, ry + 20); ctx.lineTo(cx - 5, ry + 14);
      ctx.closePath(); ctx.fill();
    }
    ctx.font = "10px sans-serif"; ctx.fillStyle = "#64748b";
    ctx.fillText(need === Infinity ? "최고 랭크" : "다음 랭크까지의 수련", px + 264, ry + 33);
  });
  ctx.font = "11px sans-serif"; ctx.fillStyle = "#475569";
  ctx.fillText("* 문자 티어 돌파(승급 시험)는 추후 업데이트 — 현재는 자동 승급", px + 28, py + PH - 20);

  // ----- 우: 퀘스트 일지
  const qx = px + 440;
  ctx.font = "bold 15px sans-serif"; ctx.fillStyle = "#e2e8f0";
  ctx.fillText("퀘스트 일지", qx, py + 78);
  QUESTS.forEach((q, i)=>{
    const ry = py + 100 + i*74;
    const state = i < questState.idx ? "done" : i === questState.idx && !questState.doneAll ? "active" : "locked";
    ctx.fillStyle = state === "active" ? "rgba(251,191,36,.08)" : "rgba(0,0,0,.25)";
    roundRect(qx, ry - 14, 352, 62, 8); ctx.fill();
    if(state === "active"){
      ctx.strokeStyle = "#fbbf24"; ctx.lineWidth = 1.5;
      roundRect(qx, ry - 14, 352, 62, 8); ctx.stroke();
    }
    ctx.font = "bold 14px sans-serif";
    ctx.fillStyle = state === "done" ? "#4ade80" : state === "active" ? "#fbbf24" : "#475569";
    const mark = state === "done" ? "✓ " : state === "active" ? "▶ " : "잠김 · ";
    ctx.fillText(mark + q.name, qx + 12, ry + 6);
    ctx.font = "12px sans-serif";
    ctx.fillStyle = state === "locked" ? "#3f4b63" : "#94a3b8";
    ctx.fillText(q.desc + (state === "active" ? `   (${questState.prog}/${q.need})` : ""), qx + 12, ry + 24);
    ctx.font = "11px sans-serif";
    ctx.fillStyle = state === "locked" ? "#334155" : "#84cc16";
    const rw = q.rewards.map(([k,s])=>`${STAT_DEFS[k].name}[${s}]`).join(" ") + `  EXP ${q.exp}`;
    ctx.fillText("보상: " + rw, qx + 12, ry + 40);
  });
  ctx.restore();
}

function drawSkillSlot(x, y, key, name, cdRatio, usable, locked){
  const S = 56;
  ctx.save();
  ctx.fillStyle = "rgba(10,12,24,.78)";
  roundRect(x, y, S, S, 8); ctx.fill();
  ctx.strokeStyle = locked ? "#334155" : usable ? "#64748b" : "#7f1d1d";
  ctx.lineWidth = 2;
  roundRect(x, y, S, S, 8); ctx.stroke();
  if(locked){
    // 자물쇠 — 수업으로 해금
    ctx.strokeStyle = "#94a3b8"; ctx.lineWidth = 2.5;
    ctx.beginPath(); ctx.arc(x + S/2, y + S/2 - 10, 6, Math.PI, 0); ctx.stroke();
    ctx.fillStyle = "#94a3b8";
    ctx.fillRect(x + S/2 - 8, y + S/2 - 10, 16, 13);
  }else{
    // 아이콘(임시: 색 원)
    const iconCol = name==="불티" ? "#ffb35c" : name==="화염구" ? "#ff6b3a" : name==="화염장판" ? "#ff8c3a" : "#8ab6ff";
    ctx.fillStyle = usable ? iconCol : "#555";
    ctx.beginPath(); ctx.arc(x + S/2, y + S/2 - 4, 13, 0, Math.PI*2); ctx.fill();
    // 쿨다운 오버레이
    const k = clamp(cdRatio, 0, 1);
    if(k > 0){
      ctx.fillStyle = "rgba(0,0,0,.62)";
      ctx.beginPath();
      ctx.moveTo(x + S/2, y + S/2);
      ctx.arc(x + S/2, y + S/2, S*0.72, -Math.PI/2, -Math.PI/2 + Math.PI*2*k);
      ctx.closePath();
      ctx.save();
      roundRect(x, y, S, S, 8); ctx.clip();
      ctx.fill();
      ctx.restore();
    }
  }
  ctx.textAlign = "center";
  ctx.font = "bold 11px sans-serif"; ctx.fillStyle = locked ? "#64748b" : "#fbbf24";
  ctx.fillText(key, x + S/2, y + 13);
  ctx.font = "10px sans-serif"; ctx.fillStyle = locked ? "#64748b" : "#cbd5e1";
  ctx.fillText(name, x + S/2, y + S - 6);
  ctx.restore();
}

function bar(x, y, w, h, ratio, fg, bg){
  ctx.fillStyle = bg;
  ctx.fillRect(x, y, w, h);
  ctx.fillStyle = fg;
  ctx.fillRect(x, y, w * clamp(ratio, 0, 1), h);
  ctx.strokeStyle = "rgba(0,0,0,.5)"; ctx.lineWidth = 1;
  ctx.strokeRect(x + .5, y + .5, w - 1, h - 1);
}

function roundRect(x, y, w, h, r){
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}

// ============================== MAIN LOOP ==============================
loadGame();   // 저장 데이터 이어하기
let last = performance.now(), acc = 0;
function frame(now){
  requestAnimationFrame(frame);
  let dt = (now - last) / 1000;
  last = now;
  if(dt > 0.25) dt = 0.25;   // 탭 복귀 스파이크 방지

  // 히트스톱: 실시간으로 감소, 정지 중엔 시뮬레이션 스킵
  if(juice.hitstop > 0){
    juice.hitstop -= dt;
    render();
    return;
  }

  acc += dt;
  while(acc >= DT){
    update(DT);
    acc -= DT;
  }
  render();
}
requestAnimationFrame(frame);
</script>
