const WORLD = (()=>{
  let x0=0,x1=0,y0=0,y1=0;
  for(const f of FLOORS){
    x1=Math.max(x1,f.w); y1=Math.max(y1,f.yOff+f.h);
    for(const g of f.geo){ x0=Math.min(x0,g.x[0]); x1=Math.max(x1,g.x[1]); }
  }
  return {x0,x1,y0,y1};
})();

/* 2. 유틸                                                             */
/* ------------------------------------------------------------------ */
function mulberry(seed){ return function(){
  seed|=0; seed=seed+0x6D2B79F5|0;
  let t=Math.imul(seed^seed>>>15,1|seed);
  t=t+Math.imul(t^t>>>7,61|t)^t;
  return ((t^t>>>14)>>>0)/4294967296; };}
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const lerp=(a,b,t)=>a+(b-a)*t;
function rr(ctx,x,y,w,h,r){
  r=Math.min(r,Math.abs(w)/2,Math.abs(h)/2);
  ctx.beginPath();
  ctx.moveTo(x+r,y); ctx.lineTo(x+w-r,y); ctx.quadraticCurveTo(x+w,y,x+w,y+r);
  ctx.lineTo(x+w,y+h-r); ctx.quadraticCurveTo(x+w,y+h,x+w-r,y+h);
  ctx.lineTo(x+r,y+h); ctx.quadraticCurveTo(x,y+h,x,y+h-r);
  ctx.lineTo(x,y+r); ctx.quadraticCurveTo(x,y,x+r,y); ctx.closePath();
}

const cv=document.getElementById("c"), ctx=cv.getContext("2d");
let W=0,H=0,DPR=1;
function resize(){
  DPR=Math.min(2,window.devicePixelRatio||1);
  W=window.innerWidth; H=window.innerHeight;
  cv.width=W*DPR; cv.height=H*DPR; cv.style.width=W+"px"; cv.style.height=H+"px";
  ctx.setTransform(DPR,0,0,DPR,0,0);
}
window.addEventListener("resize",resize); resize();

const cam={x:8,y:3,zoom:58,tx:8,ty:3,tzoom:58};
function sx(wx){ return (wx-cam.x)*cam.zoom + W/2; }
function sy(wy){ return H/2 - (wy-cam.y)*cam.zoom; }
function wxAt(px){ return (px-W/2)/cam.zoom + cam.x; }
function wyAt(py){ return (H/2-py)/cam.zoom + cam.y; }
function focusFloor(n){
  const f=FLOORS.find(a=>a.n===n); if(!f) return;
  cam.tx=f.w/2; cam.ty=f.yOff+f.h/2;
  cam.tzoom=clamp(Math.min(W/(f.w+3), H/(f.h+3)),18,150);
  ui.floorFocus=n;
}
function overview(){
  cam.tx=(WORLD.x1)/2; cam.ty=(WORLD.y1)/2;
  cam.tzoom=Math.min(W/(WORLD.x1+4), H/(WORLD.y1+4));
  ui.floorFocus=0;
}

/* ------------------------------------------------------------------ */
/* 4. 입력                                                             */
/* ------------------------------------------------------------------ */
const keys={};
const ui={labels:true, debug:false, grid:false, plan:true, floorFocus:1, help:true, mouse:{x:0,y:0}};
addEventListener("keydown",e=>{
  keys[e.key.toLowerCase()]=true;
  const k=e.key.toLowerCase();
  if(k>="1"&&k<="7") focusFloor(+k);
  if(k==="o") overview();
  if(k==="l") ui.labels=!ui.labels;
  if(k==="k") ui.debug=!ui.debug;
  if(k==="g") ui.grid=!ui.grid;
  if(k==="p") ui.plan=!ui.plan;
  if(k==="h") ui.help=!ui.help;
  if(["arrowup","arrowdown","arrowleft","arrowright"," "].includes(k)) e.preventDefault();
});
addEventListener("keyup",e=>{ keys[e.key.toLowerCase()]=false; });
let drag=null;
cv.addEventListener("mousedown",e=>{ drag={px:e.clientX,py:e.clientY,cx:cam.tx,cy:cam.ty}; cv.classList.add("drag"); });
addEventListener("mouseup",()=>{ drag=null; cv.classList.remove("drag"); });
addEventListener("mousemove",e=>{
  ui.mouse.x=e.clientX; ui.mouse.y=e.clientY;
  if(drag){ cam.tx=drag.cx-(e.clientX-drag.px)/cam.zoom; cam.ty=drag.cy+(e.clientY-drag.py)/cam.zoom; }
});
cv.addEventListener("wheel",e=>{
  e.preventDefault();
  const f=Math.exp(-e.deltaY*0.0013);
  cam.tzoom=clamp(cam.tzoom*f,6,220);
},{passive:false});

/* ------------------------------------------------------------------ */
/* 5. 배경 — 하늘 · 구름 · 원경 신전                                    */
/* ------------------------------------------------------------------ */
const rnd=mulberry(20260807);
const CLOUDS=[]; for(let i=0;i<90;i++){
  CLOUDS.push({ x:rnd()*1.6-0.3, y:rnd()*1.15-0.05, s:0.5+rnd()*2.4,
                d:0.10+rnd()*0.55, a:0.10+rnd()*0.32, ph:rnd()*99 });
}
const MOTES=[]; for(let i=0;i<120;i++){
  MOTES.push({ x:rnd()*WORLD.x1, y:rnd()*WORLD.y1, r:0.02+rnd()*0.05,
               sp:0.15+rnd()*0.5, ph:rnd()*99 });
}
const SPIRES=[]; for(let i=0;i<7;i++){
  SPIRES.push({x:rnd(), w:0.03+rnd()*0.05, h:0.12+rnd()*0.28, d:0.14+rnd()*0.2});
}

function drawSky(T){
  // 고도(카메라 y)에 따라 하늘이 밝아짐 — 상승 동기 시각화
  const alt=clamp(cam.y/WORLD.y1,0,1);
  const g=ctx.createLinearGradient(0,0,0,H);
  g.addColorStop(0, mix(PAL.skyTop,"#2b4b78",alt));
  g.addColorStop(0.45, mix(PAL.skyMid,"#7fa4cc",alt));
  g.addColorStop(0.80, mix(PAL.skyLow,"#dfe9f2",alt*0.9));
  g.addColorStop(1, mix("#7a8ba3",PAL.skyHaze,alt*0.85));
  ctx.fillStyle=g; ctx.fillRect(0,0,W,H);

  // 태양 신광
  const sunX=W*0.80, sunY=H*(0.16-alt*0.05);
  const sg=ctx.createRadialGradient(sunX,sunY,0,sunX,sunY,Math.max(W,H)*0.55);
  sg.addColorStop(0,`rgba(255,246,214,${0.34+alt*0.22})`);
  sg.addColorStop(0.28,`rgba(255,226,168,${0.13+alt*0.10})`);
  sg.addColorStop(1,"rgba(255,220,160,0)");
  ctx.fillStyle=sg; ctx.fillRect(0,0,W,H);

  // 원경 신전 첨탑 실루엣 (아주 느린 패럴랙스)
  ctx.save();
  for(const s of SPIRES){
    const px=((s.x*1.4 - cam.x*0.008*s.d)%1.4+1.4)%1.4;
    const X=px*W*1.1-W*0.05;
    const baseY=H*0.66 + (cam.y*0.9*s.d);
    const hh=H*s.h;
    ctx.fillStyle=`rgba(122,146,178,${0.16+s.d*0.16})`;
    ctx.fillRect(X, baseY-hh, W*s.w, hh);
    ctx.beginPath(); ctx.moveTo(X-W*0.012,baseY-hh);
    ctx.lineTo(X+W*s.w/2, baseY-hh-H*0.05);
    ctx.lineTo(X+W*s.w+W*0.012, baseY-hh); ctx.closePath(); ctx.fill();
  }
  ctx.restore();

  // 구름 바다 (다층 패럴랙스)
  for(const c of CLOUDS){
    const pxr=((c.x - cam.x*0.006*c.d)%1.5+1.5)%1.5;
    const X=pxr*W*1.2-W*0.1;
    const Y=(c.y*H*1.4) + cam.y*c.d*7 - H*0.12 + Math.sin(T*0.00013+c.ph)*6;
    if(Y<-200||Y>H+200) continue;
    const rw=W*0.10*c.s, rh=rw*0.30;
    const cg=ctx.createRadialGradient(X,Y,0,X,Y,rw);
    cg.addColorStop(0,`rgba(255,255,255,${c.a})`);
    cg.addColorStop(0.55,`rgba(236,244,252,${c.a*0.55})`);
    cg.addColorStop(1,"rgba(226,238,250,0)");
    ctx.fillStyle=cg;
    ctx.beginPath(); ctx.ellipse(X,Y,rw,rh,0,0,7); ctx.fill();
  }
}
function mix(a,b,t){
  const pa=parseInt(a.slice(1),16), pb=parseInt(b.slice(1),16);
  const r=Math.round(lerp((pa>>16)&255,(pb>>16)&255,t));
  const g=Math.round(lerp((pa>>8)&255,(pb>>8)&255,t));
  const bl=Math.round(lerp(pa&255,pb&255,t));
  return `rgb(${r},${g},${bl})`;
}

/* ------------------------------------------------------------------ */
/* 6. 지오메트리 렌더                                                  */
/* ------------------------------------------------------------------ */
function drawChamber(f,T){
  // 각 층 = 별개의 방(포탈 연결). 불투명한 어두운 신전 내부 → 대리석 지형이 도드라지게.
  const x0=sx(-0.8), x1=sx(f.w+0.8);
  const y1=sy(f.yOff-0.4), y0=sy(f.yOff+f.h+0.4);
  const Wd=x1-x0, Hd=y1-y0;
  if(x1<-40||x0>W+40||y1<-40||y0>H+40) return;
  ctx.save();
  ctx.beginPath(); ctx.rect(x0,y0,Wd,Hd); ctx.clip();

  // 내부 벽면 (깊은 청슬레이트)
  const g=ctx.createLinearGradient(0,y0,0,y1);
  g.addColorStop(0,"#243149");
  g.addColorStop(0.42,"#1b2438");
  g.addColorStop(1,"#121a2b");
  ctx.fillStyle=g; ctx.fillRect(x0,y0,Wd,Hd);

  // 블라인드 아케이드(장식 아치 니치) — 신전 벽면
  const z=cam.zoom;
  if(z>10){
    const step=Math.max(2.2, 3.0);
    const aw=step*0.72*z, ah=Math.min(Hd*0.55, 3.2*z);
    for(let ax=0; ax<f.w+step; ax+=step){
      const AX=sx(ax+0.3), AY=y1-ah-Hd*0.06;
      if(AX+aw<x0||AX>x1) continue;
      ctx.save();
      ctx.beginPath();
      ctx.moveTo(AX,y1-Hd*0.06);
      ctx.lineTo(AX,AY+aw*0.45);
      ctx.quadraticCurveTo(AX+aw/2,AY-aw*0.12,AX+aw,AY+aw*0.45);
      ctx.lineTo(AX+aw,y1-Hd*0.06); ctx.closePath();
      const ag=ctx.createLinearGradient(0,AY,0,y1);
      ag.addColorStop(0,"rgba(9,14,25,0.55)");
      ag.addColorStop(1,"rgba(9,14,25,0.14)");
      ctx.fillStyle=ag; ctx.fill();
      ctx.strokeStyle="rgba(150,176,214,0.10)"; ctx.lineWidth=1.2; ctx.stroke();
      ctx.restore();
    }
  }
  // 코니스 수평선
  ctx.strokeStyle="rgba(160,186,224,0.07)"; ctx.lineWidth=1;
  for(let cy=2; cy<f.h; cy+=3){
    const CY=sy(f.yOff+cy);
    ctx.beginPath(); ctx.moveTo(x0,CY); ctx.lineTo(x1,CY); ctx.stroke();
  }
  // 상단 성광(출구 방향 유도)
  const rg=ctx.createLinearGradient(0,y0,0,y0+Hd*0.45);
  rg.addColorStop(0,"rgba(255,238,190,0.16)");
  rg.addColorStop(1,"rgba(255,238,190,0)");
  ctx.fillStyle=rg; ctx.fillRect(x0,y0,Wd,Hd*0.45);
  ctx.restore();

  // 방 테두리 금선
  ctx.save();
  ctx.strokeStyle="rgba(232,200,106,0.28)"; ctx.lineWidth=2;
  ctx.strokeRect(x0,y0,Wd,Hd);
  ctx.strokeStyle="rgba(10,16,28,0.6)"; ctx.lineWidth=1;
  ctx.strokeRect(x0-1.5,y0-1.5,Wd+3,Hd+3);
  ctx.restore();
}

function drawGodRays(f,T){
  const z=cam.zoom;
  if(z<14) return;
  ctx.save(); ctx.globalCompositeOperation="lighter";
  const n=4;
  for(let i=0;i<n;i++){
    const bx=f.w*(0.55+i*0.14), top=f.yOff+f.h;
    const wTop=0.5+i*0.2, wBot=2.0+i*0.7;
    const a=0.05+0.02*Math.sin(T*0.0004+i);
    ctx.beginPath();
    ctx.moveTo(sx(bx-wTop/2), sy(top));
    ctx.lineTo(sx(bx+wTop/2), sy(top));
    ctx.lineTo(sx(bx+wBot/2), sy(f.yOff));
    ctx.lineTo(sx(bx-wBot/2), sy(f.yOff));
    ctx.closePath();
    const rg=ctx.createLinearGradient(0,sy(top),0,sy(f.yOff));
    rg.addColorStop(0,`rgba(255,244,206,${a})`);
    rg.addColorStop(1,"rgba(255,244,206,0)");
    ctx.fillStyle=rg; ctx.fill();
  }
  ctx.restore();
}

/* 대리석 지형 블록 — 어두운 석재 몸체 + 밝은 대리석 상판 + 금 트림 (고대비) */
function drawMarble(gx0,gy0,gx1,gy1,opt={}){
  const z=cam.zoom;
  // 지면 슬래브는 챔버 바닥까지 몸체를 늘려 "땅 덩어리"로 읽히게
  const bot = (opt.massTo!=null && opt.massTo<gy0) ? opt.massTo : gy0;
  const X=sx(gx0), Y=sy(gy1), Wd=(gx1-gx0)*z, Hd=Math.max((gy1-bot)*z, 4);
  if(X>W+40||X+Wd<-40||Y>H+40||Y+Hd<-40) return;
  const cap=Math.min(Hd*0.42, Math.max(3, z*0.14));   // 상판 두께
  ctx.save();
  // 접지 그림자
  ctx.fillStyle="rgba(4,8,18,0.45)"; ctx.fillRect(X+2,Y+3,Wd,Hd);
  // 몸체 (어두운 석재)
  const g=ctx.createLinearGradient(0,Y,0,Y+Hd);
  g.addColorStop(0,"#7d8daa"); g.addColorStop(0.28,"#61708e");
  g.addColorStop(0.78,"#48566f"); g.addColorStop(1,"#3a4761");
  ctx.fillStyle=g; ctx.fillRect(X,Y,Wd,Hd);
  // 세로 석재 이음선
  if(z>24&&Wd>20){
    ctx.strokeStyle="rgba(12,18,30,0.35)"; ctx.lineWidth=1;
    const n=Math.max(1,Math.floor(Wd/(z*0.9)));
    for(let i=1;i<n;i++){ const bx=Math.round(X+Wd*i/n)+0.5;
      ctx.beginPath(); ctx.moveTo(bx,Y+cap); ctx.lineTo(bx,Y+Hd); ctx.stroke(); }
  }
  // 밝은 대리석 상판
  const cg=ctx.createLinearGradient(0,Y,0,Y+cap);
  cg.addColorStop(0,PAL.marbleHi); cg.addColorStop(0.6,PAL.marble); cg.addColorStop(1,PAL.marbleLo);
  ctx.fillStyle=cg; ctx.fillRect(X,Y,Wd,cap);
  // 대리석 결
  if(z>30&&Wd>26){
    ctx.save(); ctx.beginPath(); ctx.rect(X,Y,Wd,cap); ctx.clip();
    ctx.strokeStyle="rgba(120,140,170,0.35)"; ctx.lineWidth=1;
    const rg=mulberry(Math.round(gx0*97+gy0*31));
    for(let i=0;i<Math.max(2,Wd/46);i++){
      const vx=X+rg()*Wd, vy=Y+rg()*cap;
      ctx.beginPath(); ctx.moveTo(vx,vy); ctx.quadraticCurveTo(vx+10,vy+2,vx+22,vy-1); ctx.stroke();
    }
    ctx.restore();
  }
  // 금 트림 (상판 아래 경계)
  ctx.fillStyle=PAL.gold;   ctx.fillRect(X,Y+cap,Wd,Math.max(1.4,z*0.028));
  ctx.fillStyle=PAL.goldHi; ctx.fillRect(X,Y,Wd,Math.max(1,z*0.014));
  // 좌우 베벨
  ctx.fillStyle="rgba(255,255,255,0.10)"; ctx.fillRect(X,Y,Math.max(1,z*0.02),Hd);
  ctx.fillStyle="rgba(6,10,20,0.35)";     ctx.fillRect(X+Wd-Math.max(1,z*0.02),Y,Math.max(1,z*0.02),Hd);
  ctx.restore();
}

/* 한방향 발판 — 얇은 금테 + 반투명 성광 커튼(아래→위 통과 신호) */
function drawOneway(gx0,gy0,gx1,gy1,T){
  const X=sx(gx0), Y=sy(gy1), Wd=(gx1-gx0)*cam.zoom, Hd=Math.max((gy1-gy0)*cam.zoom,3);
  if(X>W+40||X+Wd<-40) return;
  ctx.save();
  const g=ctx.createLinearGradient(0,Y,0,Y+Hd);
  g.addColorStop(0,PAL.marbleHi); g.addColorStop(1,PAL.marbleLo);
  ctx.fillStyle=g; rr(ctx,X,Y,Wd,Hd,2); ctx.fill();
  ctx.fillStyle=PAL.oneway; ctx.fillRect(X,Y,Wd,Math.max(1.4,cam.zoom*0.03));
  // 아래쪽 성광 커튼
  const cg=ctx.createLinearGradient(0,Y+Hd,0,Y+Hd+cam.zoom*0.42);
  const a=0.20+0.08*Math.sin(T*0.003);
  cg.addColorStop(0,`rgba(255,238,190,${a})`); cg.addColorStop(1,"rgba(255,238,190,0)");
  ctx.fillStyle=cg; ctx.fillRect(X,Y+Hd,Wd,cam.zoom*0.42);
  ctx.restore();
}

/* 벽 / 기둥 — 세로 홈(fluting) + 금 캐피털 */
function drawWall(gx0,gy0,gx1,gy1){
  const X=sx(gx0), Y=sy(gy1), Wd=(gx1-gx0)*cam.zoom, Hd=(gy1-gy0)*cam.zoom;
  if(X>W+40||X+Wd<-40||Y>H+40||Y+Hd<-40) return;
  const z=cam.zoom;
  ctx.save();
  ctx.fillStyle="rgba(4,8,18,0.40)"; ctx.fillRect(X+2,Y+2,Wd,Hd);
  const g=ctx.createLinearGradient(X,0,X+Wd,0);
  g.addColorStop(0,"#232d42"); g.addColorStop(0.30,"#4a5A76");
  g.addColorStop(0.55,"#3a4761"); g.addColorStop(1,"#1a2233");
  ctx.fillStyle=g; ctx.fillRect(X,Y,Wd,Hd);
  if(z>18&&Wd>7){
    const n=Math.max(1,Math.floor(Wd/Math.max(7,z*0.16)));
    for(let i=1;i<n;i++){ const fx=Math.round(X+Wd*i/n)+0.5;
      ctx.strokeStyle="rgba(140,166,204,0.13)"; ctx.lineWidth=1;
      ctx.beginPath(); ctx.moveTo(fx,Y+2); ctx.lineTo(fx,Y+Hd-2); ctx.stroke();
      ctx.strokeStyle="rgba(8,12,22,0.32)";
      ctx.beginPath(); ctx.moveTo(fx+1.4,Y+2); ctx.lineTo(fx+1.4,Y+Hd-2); ctx.stroke(); }
  }
  // 금 캐피털(상·하단 띠)
  const cap=Math.max(2,z*0.055);
  ctx.fillStyle=PAL.goldLo;
  ctx.fillRect(X-Wd*0.12,Y,Wd*1.24,cap);
  ctx.fillRect(X-Wd*0.12,Y+Hd-cap,Wd*1.24,cap);
  ctx.fillStyle=PAL.gold;
  ctx.fillRect(X-Wd*0.12,Y,Wd*1.24,Math.max(1,z*0.022));
  ctx.restore();
}

/* 창 꽂기 면 — 은청 빛결정 광맥 (플레이어 유도 시그널) */
function drawSpearFace(g,T){
  const X=sx(g.x[0]), Y=sy(g.y[1]);
  const Wd=Math.max((g.x[1]-g.x[0])*cam.zoom, 3), Hd=(g.y[1]-g.y[0])*cam.zoom;
  if(X>W+60||X+Wd<-60) return;
  ctx.save(); ctx.globalCompositeOperation="lighter";
  const pulse=0.45+0.25*Math.sin(T*0.0022+g.y[0]);
  // 면 자체 발광
  const fg=ctx.createLinearGradient(X,0,X+Wd*(g.face==="L"?-2.2:2.2),0);
  fg.addColorStop(0,`rgba(143,220,240,${0.42*pulse})`);
  fg.addColorStop(1,"rgba(143,220,240,0)");
  if(g.face==="U"){
    const ug=ctx.createLinearGradient(0,Y,0,Y-cam.zoom*0.6);
    ug.addColorStop(0,`rgba(143,220,240,${0.40*pulse})`); ug.addColorStop(1,"rgba(143,220,240,0)");
    ctx.fillStyle=ug; ctx.fillRect(X,Y-cam.zoom*0.6,Wd,cam.zoom*0.6);
  }else{
    ctx.fillStyle=fg;
    ctx.fillRect(g.face==="L"?X-Wd*2.2:X, Y, Wd*2.2, Hd);
  }
  ctx.restore();
  // 광맥 라인
  ctx.save();
  ctx.strokeStyle=`rgba(180,238,255,${0.55+0.2*Math.sin(T*0.003)})`;
  ctx.lineWidth=Math.max(1.5,cam.zoom*0.035);
  ctx.beginPath();
  if(g.face==="U"){ ctx.moveTo(X,Y); ctx.lineTo(X+Wd,Y); }
  else{ const lx=g.face==="L"?X:X+Wd; ctx.moveTo(lx,Y); ctx.lineTo(lx,Y+Hd); }
  ctx.stroke();
  // 결정 노드
  if(cam.zoom>16){
    const steps=Math.max(2,Math.round((g.y[1]-g.y[0])));
    for(let i=0;i<=steps;i++){
      const t=i/steps;
      const cx=g.face==="U"? lerp(X,X+Wd,t) : (g.face==="L"?X:X+Wd);
      const cy=g.face==="U"? Y : lerp(Y,Y+Hd,t);
      const r=(2.0+1.2*Math.sin(T*0.004+i))*Math.max(0.6,cam.zoom/48);
      ctx.fillStyle="rgba(200,244,255,0.9)";
      ctx.beginPath(); ctx.arc(cx,cy,r*0.5,0,7); ctx.fill();
      ctx.fillStyle="rgba(143,220,240,0.28)";
      ctx.beginPath(); ctx.arc(cx,cy,r*1.7,0,7); ctx.fill();
    }
  }
  ctx.restore();
}

/* 도약 나브 — 첨탑 장식(finial) */
function drawVault(g,T){
  const cx=sx((g.x[0]+g.x[1])/2), top=sy(g.y[1]), bot=sy(g.y[0]);
  const half=(g.x[1]-g.x[0])/2*cam.zoom;
  ctx.save();
  const gr=ctx.createLinearGradient(0,top,0,bot);
  gr.addColorStop(0,PAL.goldHi); gr.addColorStop(0.5,PAL.gold); gr.addColorStop(1,PAL.goldLo);
  ctx.fillStyle=gr;
  ctx.beginPath(); ctx.moveTo(cx,top);
  ctx.lineTo(cx+half,bot); ctx.lineTo(cx-half,bot); ctx.closePath(); ctx.fill();
  ctx.fillStyle=`rgba(255,240,190,${0.25+0.12*Math.sin(T*0.004)})`;
  ctx.beginPath(); ctx.arc(cx,top,half*1.5,0,7); ctx.fill();
  ctx.restore();
}

/* 낙하존 — 소용돌이 구름 심연 */
function drawFall(g,T){
  const X=sx(g.x[0]), Wd=(g.x[1]-g.x[0])*cam.zoom;
  const Y=sy(g.y[1]), Hd=Math.max((g.y[1]-g.y[0])*cam.zoom, cam.zoom*0.8);
  if(X>W+40||X+Wd<-40) return;
  ctx.save();
  const dg=ctx.createLinearGradient(0,Y,0,Y+Hd*2.2);
  dg.addColorStop(0,"rgba(30,44,70,0.0)");
  dg.addColorStop(0.35,"rgba(24,36,60,0.55)");
  dg.addColorStop(1,"rgba(10,18,34,0.92)");
  ctx.fillStyle=dg; ctx.fillRect(X,Y,Wd,Hd*2.2);
  // 흐르는 구름 결
  ctx.globalAlpha=0.35;
  for(let i=0;i<5;i++){
    const yy=Y+Hd*0.25+i*Hd*0.34 + Math.sin(T*0.0006+i*1.7)*6;
    const cg=ctx.createLinearGradient(X,yy,X+Wd,yy);
    cg.addColorStop(0,"rgba(150,175,205,0)");
    cg.addColorStop(0.5,`rgba(150,175,205,${0.20+0.08*Math.sin(T*0.001+i)})`);
    cg.addColorStop(1,"rgba(150,175,205,0)");
    ctx.fillStyle=cg;
    ctx.beginPath(); ctx.ellipse(X+Wd/2,yy,Wd*0.55,Hd*0.13,0,0,7); ctx.fill();
  }
  ctx.restore();
  // 위험 경계 라인
  ctx.save();
  ctx.strokeStyle="rgba(255,140,120,0.30)"; ctx.setLineDash([7,6]); ctx.lineWidth=1.5;
  ctx.beginPath(); ctx.moveTo(X,Y); ctx.lineTo(X+Wd,Y); ctx.stroke();
  ctx.restore();
}

function drawShrine(s,f,T){
  const X=sx(s.x), Y=sy(f.yOff+s.y);
  const z=cam.zoom, pulse=0.6+0.4*Math.sin(T*0.0022);
  ctx.save(); ctx.globalCompositeOperation="lighter";
  const bg=ctx.createLinearGradient(0,Y,0,Y-z*3.4);
  bg.addColorStop(0,`rgba(255,226,150,${0.30*pulse})`);
  bg.addColorStop(0.5,`rgba(255,226,150,${0.10*pulse})`);
  bg.addColorStop(1,"rgba(255,226,150,0)");
  ctx.fillStyle=bg; ctx.fillRect(X-z*0.42,Y-z*3.4,z*0.84,z*3.4);
  ctx.restore();
  // 바닥 금 문양
  ctx.save();
  ctx.strokeStyle=`rgba(240,206,120,${0.75*pulse})`; ctx.lineWidth=Math.max(1.4,z*0.035);
  ctx.beginPath(); ctx.ellipse(X,Y,z*0.46,z*0.15,0,0,7); ctx.stroke();
  ctx.beginPath(); ctx.ellipse(X,Y,z*0.26,z*0.085,0,0,7); ctx.stroke();
  ctx.fillStyle=`rgba(255,242,200,${0.9*pulse})`;
  ctx.beginPath(); ctx.arc(X,Y-z*0.10,Math.max(1.6,z*0.05),0,7); ctx.fill();
  ctx.restore();
}

function drawDummy(d,f,T){
  const X=sx(d.x), Y=sy(f.yOff+d.y), z=cam.zoom;
  const hgt=z*0.95, wid=z*0.32;
  ctx.save();
  const bob = d.k==="a" ? Math.sin(T*0.0016+d.x)*z*0.05 : 0;
  const yy=Y+bob;
  // 공중형: 부유 링
  if(d.k==="a"){
    ctx.save(); ctx.globalCompositeOperation="lighter";
    ctx.strokeStyle=`rgba(143,220,240,${0.30+0.15*Math.sin(T*0.003)})`;
    ctx.lineWidth=Math.max(1,z*0.022);
    ctx.beginPath(); ctx.ellipse(X,yy+z*0.10,z*0.38,z*0.11,0,0,7); ctx.stroke();
    ctx.restore();
  }
  // 반격표적: 붉은/황금 예고 오라
  if(d.k==="c"){
    ctx.save(); ctx.globalCompositeOperation="lighter";
    const p=0.5+0.5*Math.sin(T*0.0028);
    const rg=ctx.createRadialGradient(X,yy-hgt*0.5,0,X,yy-hgt*0.5,z*0.9);
    rg.addColorStop(0,`rgba(255,150,110,${0.26*p})`);
    rg.addColorStop(1,"rgba(255,150,110,0)");
    ctx.fillStyle=rg; ctx.beginPath(); ctx.arc(X,yy-hgt*0.5,z*0.9,0,7); ctx.fill();
    ctx.restore();
  }
  // 기둥 몸체(대리석)
  const g=ctx.createLinearGradient(X-wid/2,0,X+wid/2,0);
  g.addColorStop(0,PAL.marbleLo); g.addColorStop(0.4,PAL.marbleHi); g.addColorStop(1,PAL.marbleLo);
  ctx.fillStyle=g;
  rr(ctx,X-wid/2, yy-hgt, wid, hgt, Math.max(1.5,z*0.05)); ctx.fill();
  // 금 밴드
  ctx.fillStyle = d.k==="c" ? "#e08a5a" : PAL.gold;
  ctx.fillRect(X-wid*0.62, yy-hgt*0.72, wid*1.24, Math.max(1.6,z*0.05));
  ctx.fillRect(X-wid*0.52, yy-hgt*0.30, wid*1.04, Math.max(1.4,z*0.04));
  // 머리
  ctx.fillStyle=PAL.marbleHi;
  ctx.beginPath(); ctx.arc(X,yy-hgt-wid*0.28,wid*0.42,0,7); ctx.fill();
  ctx.fillStyle=PAL.goldLo;
  ctx.beginPath(); ctx.arc(X,yy-hgt-wid*0.28,wid*0.42,0,7); ctx.stroke();
  // 벽걸이: 부착 브래킷
  if(d.k==="w"){
    ctx.fillStyle=PAL.goldLo;
    ctx.fillRect(X-wid*0.9, yy-hgt*0.6, wid*0.5, Math.max(2,z*0.05));
  }
  ctx.restore();
}

function drawCrystal(cy,f,T){

function drawBell(f,T){
  const gl=f.goal; if(!gl) return;
  const x0=sx(gl.x[0]), x1=sx(gl.x[1]);
  const yTop=sy(f.yOff+gl.y[1]), yBot=sy(f.yOff+gl.y[0]);
  const cx=(x0+x1)/2, bw=x1-x0, bh=yBot-yTop, z=cam.zoom;
  ctx.save(); ctx.globalCompositeOperation="lighter";
  const p=0.55+0.45*Math.sin(T*0.0015);
  const rg=ctx.createRadialGradient(cx,(yTop+yBot)/2,0,cx,(yTop+yBot)/2,bw*1.7);
  rg.addColorStop(0,`rgba(255,226,140,${0.34*p})`); rg.addColorStop(1,"rgba(255,226,140,0)");
  ctx.fillStyle=rg; ctx.beginPath(); ctx.arc(cx,(yTop+yBot)/2,bw*1.7,0,7); ctx.fill();
  ctx.restore();
  // 종 본체
  ctx.save();
  const g=ctx.createLinearGradient(x0,0,x1,0);
  g.addColorStop(0,"#8a6a28"); g.addColorStop(0.35,"#f0d281");
  g.addColorStop(0.6,"#e0b855"); g.addColorStop(1,"#7d5f22");
  ctx.fillStyle=g;
  ctx.beginPath();
  ctx.moveTo(cx-bw*0.16, yTop);
  ctx.bezierCurveTo(cx-bw*0.50, yTop+bh*0.30, cx-bw*0.50, yBot-bh*0.10, cx-bw*0.50, yBot);
  ctx.lineTo(cx+bw*0.50, yBot);
  ctx.bezierCurveTo(cx+bw*0.50, yBot-bh*0.10, cx+bw*0.50, yTop+bh*0.30, cx+bw*0.16, yTop);
  ctx.closePath(); ctx.fill();
  // 림
  ctx.fillStyle="#f6e2a6"; ctx.fillRect(x0-bw*0.04, yBot-Math.max(2,z*0.06), bw*1.08, Math.max(2.4,z*0.07));
  // 성문 음각
  ctx.strokeStyle="rgba(90,66,20,0.55)"; ctx.lineWidth=Math.max(1,z*0.02);
  ctx.beginPath(); ctx.moveTo(x0+bw*0.08,yBot-bh*0.34); ctx.lineTo(x1-bw*0.08,yBot-bh*0.34); ctx.stroke();
  // 크라운(상단 고리)
  ctx.strokeStyle="#d9bb63"; ctx.lineWidth=Math.max(2,z*0.05);
  ctx.beginPath(); ctx.arc(cx,yTop-z*0.10,z*0.13,Math.PI,0); ctx.stroke();
  ctx.restore();
}

/* 창꽂기 계획선 — 설계상 "어디서 어디로 던지나" (검증 시각화) */
function drawSpearPlan(f,T){
  if(!f.spearPlan) return;
  const z=cam.zoom;
  ctx.save();
  ctx.setLineDash([6,5]); ctx.lineWidth=Math.max(1,z*0.022);
  for(const p of f.spearPlan){
    const ax=sx(p.from[0]), ay=sy(f.yOff+p.from[1]);
    const bx=sx(p.to[0]),   by=sy(f.yOff+p.to[1]);
    const dist=Math.hypot(p.to[0]-p.from[0], p.to[1]-p.from[1]);
    const ok=dist<=REACH.spear;
    ctx.strokeStyle= ok? "rgba(143,220,240,0.75)":"rgba(255,120,120,0.85)";
    ctx.beginPath(); ctx.moveTo(ax,ay); ctx.lineTo(bx,by); ctx.stroke();
    // 박힌 창(작은 레지) 표시
    ctx.save(); ctx.setLineDash([]);
    ctx.strokeStyle="rgba(232,240,255,0.9)"; ctx.lineWidth=Math.max(1.6,z*0.04);
    ctx.beginPath(); ctx.moveTo(bx,by); ctx.lineTo(bx-z*0.55,by); ctx.stroke();
    ctx.fillStyle="rgba(143,220,240,0.9)";
    ctx.beginPath(); ctx.arc(bx-z*0.55,by,Math.max(1.5,z*0.05),0,7); ctx.fill();
    ctx.restore();
    if(ui.labels&&z>24){
      ctx.save(); ctx.setLineDash([]);
      ctx.font=`500 ${Math.max(8,z*0.16)}px system-ui`;
      ctx.fillStyle= ok?"rgba(190,236,255,0.9)":"rgba(255,170,170,0.95)";
      ctx.textAlign="left";
      ctx.fillText(`${dist.toFixed(1)}u ${ok?"✓":"✗ 사거리초과"}`,(ax+bx)/2+4,(ay+by)/2-4);
      ctx.restore();
    }
  }
  ctx.restore();
}

/* 비초점 층 디밍 — 현재 보는 층에 시선 집중 */
function dimFloor(f){
  const x0=sx(-0.8), x1=sx(f.w+0.8);
  const y1=sy(f.yOff-0.4), y0=sy(f.yOff+f.h+0.4);

/* 라벨 — 겹침 회피(점유 사각형 추적) */
const _lbBoxes=[];
function labelSlot(X,Y,w,h){
  for(let tryI=0;tryI<7;tryI++){
    const yy=Y-tryI*(h+3);
    let hit=false;
    for(const b of _lbBoxes)
      if(X<b.x+b.w+3 && X+w+3>b.x && yy<b.y+b.h+2 && yy+h+2>b.y){ hit=true; break; }
    if(!hit){ _lbBoxes.push({x:X,y:yy,w,h}); return yy; }
  }
  return null;
}
function drawLabels(f){
  const z=cam.zoom; if(z<24) return;
  ctx.save();
  const fs=Math.max(9,Math.min(14,z*0.16));
  ctx.font=`600 ${fs}px system-ui`;
  ctx.textAlign="left"; ctx.textBaseline="middle";
  for(const g of f.geo){
    if(g.t==="deco") continue;
    const X=sx(g.x[0])+3, baseY=sy(f.yOff+g.y[1])-fs-6;
    if(X<-200||X>W+40) continue;
    const txt=`${g.label} · y${(f.yOff+g.y[1]).toFixed(1)}`;
    const wpx=ctx.measureText(txt).width+10, hpx=fs+6;
    const Y=labelSlot(X,baseY,wpx,hpx);
    if(Y===null) continue;
    ctx.fillStyle="rgba(6,11,20,0.80)"; rr(ctx,X,Y,wpx,hpx,3); ctx.fill();
    ctx.strokeStyle=(TYPE_COL[g.t]||"#e8eefc")+"55"; ctx.lineWidth=1; ctx.stroke();
    ctx.fillStyle= TYPE_COL[g.t]||"#e8eefc";
    ctx.fillText(txt, X+5, Y+hpx/2+0.5);
  }
  ctx.restore();
}
/* 층 제목 — 챔버 '안쪽' 좌상단 배지 (윗층 것으로 오독되지 않게) */
function drawFloorTitle(f){
  const z=cam.zoom;
  const X=sx(-0.8), Ytop=sy(f.yOff+f.h+0.4), Ybot=sy(f.yOff-0.4);
  if(Ybot<0||Ytop>H) return;
  const focus = (ui.floorFocus===0 || ui.floorFocus===f.n);
  const s=Math.max(10,Math.min(22,z*0.36));
  ctx.save();
  ctx.textAlign="left"; ctx.textBaseline="middle";
  const title=`${f.n}F  ${f.name}`;
  ctx.font=`800 ${s}px system-ui`;
  const tw=ctx.measureText(title).width;
  const showSub = z>18 && focus;
  const sub=`${f.sub} · ${f.w}×${f.h}u · 전역 y ${f.yOff}–${f.yOff+f.h}`;
  ctx.font=`500 ${s*0.56}px system-ui`;
  const sw=showSub?ctx.measureText(sub).width:0;
  const bw=Math.max(tw,sw)+22, bh=showSub? s*1.95 : s*1.25;
  const bx=Math.max(4,X+8), by=Math.max(62,Ytop+8);
  // 배지
  const g=ctx.createLinearGradient(bx,by,bx,by+bh);
  g.addColorStop(0,"rgba(12,19,33,0.92)"); g.addColorStop(1,"rgba(12,19,33,0.70)");
  ctx.fillStyle=g; rr(ctx,bx,by,bw,bh,5); ctx.fill();
  ctx.fillStyle= focus? "rgba(232,200,106,0.9)":"rgba(232,200,106,0.32)";
  ctx.fillRect(bx,by,3.5,bh);
  ctx.font=`800 ${s}px system-ui`;
  ctx.fillStyle= focus? "rgba(255,238,186,0.98)":"rgba(255,238,186,0.42)";
  ctx.fillText(title, bx+12, by+(showSub? s*0.72 : bh/2));
  if(showSub){
    ctx.font=`500 ${s*0.56}px system-ui`;
    ctx.fillStyle="rgba(186,208,240,0.72)";
    ctx.fillText(sub, bx+12, by+s*1.42);
  }
  ctx.restore();
}
function drawGrid(){
  if(!ui.grid) return;
  const z=cam.zoom;
  const step = z<14?5:(z<34?2:1);
  ctx.save(); ctx.lineWidth=1;
  const wx0=Math.floor(wxAt(0)/step)*step, wx1=wxAt(W);
  const wy0=Math.floor(wyAt(H)/step)*step, wy1=wyAt(0);
  ctx.strokeStyle="rgba(160,190,230,0.10)";
  for(let x=wx0;x<=wx1;x+=step){ const X=sx(x);
    ctx.beginPath(); ctx.moveTo(X,0); ctx.lineTo(X,H); ctx.stroke(); }
  for(let y=wy0;y<=wy1;y+=step){ const Y=sy(y);
    ctx.beginPath(); ctx.moveTo(0,Y); ctx.lineTo(W,Y); ctx.stroke(); }
  if(z>26){
    ctx.fillStyle="rgba(160,190,230,0.45)"; ctx.font="10px system-ui";
    for(let x=wx0;x<=wx1;x+=step) ctx.fillText(x.toFixed(0), sx(x)+2, H-4);
    for(let y=wy0;y<=wy1;y+=step) ctx.fillText(y.toFixed(0), 3, sy(y)-2);
  }
  ctx.restore();
}

function gatingChecks(){
  const F=n=>FLOORS.find(f=>f.n===n);
  const out=[];
  // ① 3층 필수 갭
  out.push({t:"3F R1→R2 갭 3.6u > 이단 2.9u", ok:3.6>REACH.doubleJump});
  out.push({t:"3F R2→R3 갭 4.4u > 이단 2.9u", ok:4.4>REACH.doubleJump});
  // ② 4층 스킵 차단
  out.push({t:"4F 시작→먼기둥 8.9u > 사거리 5u", ok:8.9>REACH.spear});
  // ③ 5층 D-A2 창발판 강제
  out.push({t:"5F D-A2 4.3u > 지상 이단 3.9u", ok:4.3>1.0+REACH.doubleJump});
  // 창꽂기 계획 사거리
  let planOK=true, planN=0;
  for(const f of FLOORS) for(const p of (f.spearPlan||[])){
    planN++;
    if(Math.hypot(p.to[0]-p.from[0],p.to[1]-p.from[1])>REACH.spear) planOK=false;
  }
  out.push({t:`창꽂기 계획 ${planN}건 전부 사거리 5u 이내`, ok:planOK});
  return out;
}
const CHECKS=gatingChecks();

function drawMinimap(){
  const mw=104, mh=H-150, mx=W-mw-16, my=76;
  const s=Math.min(mw/(WORLD.x1+2), mh/(WORLD.y1+2));
  ctx.save();
  ctx.fillStyle="rgba(8,14,26,0.62)"; rr(ctx,mx-8,my-8,mw+16,mh+16,10); ctx.fill();
  ctx.strokeStyle="rgba(232,200,106,0.25)"; ctx.lineWidth=1; ctx.stroke();
  const MX=x=>mx+(x+1)*s, MY=y=>my+mh-(y+1)*s;
  for(const f of FLOORS){
    ctx.fillStyle= f.n===ui.floorFocus? "rgba(255,226,150,0.22)":"rgba(150,180,220,0.10)";
    ctx.fillRect(MX(0),MY(f.yOff+f.h),f.w*s,f.h*s);
    for(const g of f.geo){
      if(g.t==="air"||g.t==="deco") continue;
      ctx.fillStyle= g.t==="fall"?"rgba(255,120,100,0.55)"
                   : g.t==="spear"?"rgba(143,220,240,0.85)"
                   : g.t==="wall"?"rgba(140,158,190,0.5)":"rgba(230,240,255,0.72)";
      ctx.fillRect(MX(g.x[0]),MY(f.yOff+g.y[1]),Math.max(1,(g.x[1]-g.x[0])*s),Math.max(1,(g.y[1]-g.y[0])*s));
    }
    ctx.fillStyle="rgba(255,236,180,0.55)"; ctx.font="8px system-ui"; ctx.textAlign="right";
    ctx.fillText(f.n+"F", mx+mw, MY(f.yOff)-1);
  }
  // 시야 사각형 (미니맵 영역으로 클램프)
  const vx0=clamp(wxAt(0),-1,WORLD.x1+1), vx1=clamp(wxAt(W),-1,WORLD.x1+1);
  const vy0=clamp(wyAt(H),-1,WORLD.y1+1), vy1=clamp(wyAt(0),-1,WORLD.y1+1);
  ctx.save();
  ctx.beginPath(); ctx.rect(mx-4,my-4,mw+8,mh+8); ctx.clip();
  ctx.strokeStyle="rgba(255,255,255,0.9)"; ctx.lineWidth=1.4;
  ctx.strokeRect(MX(vx0),MY(vy1),Math.max(2,(vx1-vx0)*s),Math.max(2,(vy1-vy0)*s));
  ctx.restore();
  ctx.restore();
}

function drawHUD(T){
  // 상단 타이틀 바
  ctx.save();
  const g=ctx.createLinearGradient(0,0,0,58);
  g.addColorStop(0,"rgba(8,13,24,0.86)"); g.addColorStop(1,"rgba(8,13,24,0)");
  ctx.fillStyle=g; ctx.fillRect(0,0,W,58);
  ctx.font="800 17px system-ui"; ctx.textAlign="left";
  ctx.fillStyle="#f3e2b0";
  ctx.fillText("성창 — 잊힌 성물 · 「신전 수련장」", 18, 26);
  ctx.font="500 11.5px system-ui"; ctx.fillStyle="rgba(186,208,238,0.85)";
  ctx.fillText(`맵 프로토 v1.0 · 전역 ${WORLD.x1}×${WORLD.y1}u · 7층 · 캐릭터 미구현(맵 뷰어)`, 18, 44);
  ctx.restore();

  // 커서 좌표
  const wx=wxAt(ui.mouse.x), wy=wyAt(ui.mouse.y);
  const f=FLOORS.find(a=>wy>=a.yOff&&wy<a.yOff+a.h);
  ctx.save();
  ctx.font="600 12px ui-monospace,monospace"; ctx.textAlign="left";
  ctx.fillStyle="rgba(8,14,26,0.66)"; rr(ctx,14,H-34,286,24,6); ctx.fill();
  ctx.fillStyle="rgba(200,224,255,0.95)";
  ctx.fillText(`전역 (${wx.toFixed(2)}, ${wy.toFixed(2)})`, 22, H-18);
  if(f) ctx.fillText(`${f.n}F 로컬 y ${(wy-f.yOff).toFixed(2)}`, 168, H-18);
  ctx.restore();

  // 도움말 / 검증 패널
  if(ui.help){
    const lines=[
      ["카메라","드래그 · WASD/방향키 · 휠 줌"],
      ["층 이동","1~7  ·  O 전체 조망"],
      ["토글","L 라벨 · K 콜리전 · G 그리드 · P 창꽂기선 · H 도움말"],
    ];
    ctx.save();
    const pw=306, ph=30+lines.length*17+10+CHECKS.length*15+22;
    const px=14, py=76;
    ctx.fillStyle="rgba(8,14,26,0.72)"; rr(ctx,px,py,pw,ph,10); ctx.fill();
    ctx.strokeStyle="rgba(232,200,106,0.20)"; ctx.lineWidth=1; ctx.stroke();
    ctx.textAlign="left";
    ctx.font="700 11px system-ui"; ctx.fillStyle="#f0dda8";
    ctx.fillText("조작", px+12, py+20);
    ctx.font="500 11px system-ui";
    let yy=py+36;
    for(const [k,v] of lines){
      ctx.fillStyle="rgba(255,226,150,0.85)"; ctx.fillText(k, px+12, yy);
      ctx.fillStyle="rgba(196,216,244,0.88)"; ctx.fillText(v, px+62, yy);
      yy+=17;
    }
    yy+=8;
    ctx.font="700 11px system-ui"; ctx.fillStyle="#f0dda8";
    ctx.fillText("게이팅 무결성 검증", px+12, yy); yy+=16;
    ctx.font="500 10.5px system-ui";
    for(const c of CHECKS){
      ctx.fillStyle= c.ok? "#7fe3a0":"#ff8b7a";
      ctx.fillText(c.ok?"✓":"✗", px+12, yy);
      ctx.fillStyle="rgba(196,216,244,0.86)";
      ctx.fillText(c.t, px+26, yy); yy+=15;
    }
    ctx.restore();
  }

  // 현재 층 컨셉 배너
  const cf=FLOORS.find(a=>a.n===ui.floorFocus);
  if(cf){
    ctx.save();
    const txt=`${cf.n}F ${cf.name} — ${cf.concept}`;
    ctx.font="600 12px system-ui";
    const wpx=ctx.measureText(txt).width;
    const bx=(W-wpx-28)/2;
    ctx.fillStyle="rgba(8,14,26,0.70)"; rr(ctx,bx,H-72,wpx+28,26,8); ctx.fill();
    ctx.strokeStyle="rgba(232,200,106,0.22)"; ctx.stroke();
    ctx.fillStyle="rgba(232,240,255,0.92)"; ctx.textAlign="left";
    ctx.fillText(txt,bx+14,H-54);
    ctx.restore();
  }
}

/* 비네트 */
function drawVignette(){
  ctx.save();
  const g=ctx.createRadialGradient(W/2,H/2,Math.min(W,H)*0.35,W/2,H/2,Math.max(W,H)*0.78);
  g.addColorStop(0,"rgba(0,0,0,0)"); g.addColorStop(1,"rgba(4,8,18,0.55)");
  ctx.fillStyle=g; ctx.fillRect(0,0,W,H); ctx.restore();
}

/* ------------------------------------------------------------------ */
/* 10. 메인 루프                                                       */
/* ------------------------------------------------------------------ */
let last=performance.now();
function frame(T){
  const dt=Math.min(50,T-last); last=T;

  // 카메라 입력
  const sp=(keys["shift"]?2.4:1)*dt*0.018*(60/cam.zoom)*22;
  if(keys["a"]||keys["arrowleft"])  cam.tx-=sp;
  if(keys["d"]||keys["arrowright"]) cam.tx+=sp;
  if(keys["w"]||keys["arrowup"])    cam.ty+=sp;
  if(keys["s"]||keys["arrowdown"])  cam.ty-=sp;
  if(keys["="]||keys["+"]) cam.tzoom=clamp(cam.tzoom*1.03,6,220);
  if(keys["-"]||keys["_"]) cam.tzoom=clamp(cam.tzoom/1.03,6,220);
  const k=1-Math.pow(0.001,dt/1000);
  cam.x=lerp(cam.x,cam.tx,k); cam.y=lerp(cam.y,cam.ty,k);
  cam.zoom=lerp(cam.zoom,cam.tzoom,k);

  drawSky(T);

  // 화면에 걸치는 층만 렌더
  const vy0=wyAt(H)-2, vy1=wyAt(0)+2;
  const vis=FLOORS.filter(f=>f.yOff+f.h>vy0 && f.yOff<vy1);

  for(const f of vis) drawChamber(f,T);
  for(const f of vis) drawGodRays(f,T);

  // 배경 장식 기둥
  for(const f of vis) if(f.pillars) for(const p of f.pillars){
    ctx.save(); ctx.globalAlpha=0.42;
    drawWall(p.x-p.w/2, f.yOff+p.y0, p.x+p.w/2, f.yOff+p.y1);
    ctx.restore();
  }

  // 낙하존 / 우물 (지형 뒤)
  for(const f of vis) for(const g of f.geo){
    if(g.t==="fall") drawFall({x:g.x,y:[f.yOff+g.y[0],f.yOff+g.y[1]]},T);
    if(g.t==="air")  drawAirWell({x:g.x,y:[f.yOff+g.y[0],f.yOff+g.y[1]]},T);
  }

  // 지형
  for(const f of vis) for(const g of f.geo){
    const y0=f.yOff+g.y[0], y1=f.yOff+g.y[1];
    const mass = (g.y[0]<=0.25) ? f.yOff-0.4 : null;   // 챔버 바닥 접지 슬래브
    switch(g.t){
      case "solid": drawMarble(g.x[0],y0,g.x[1],y1,{massTo:mass}); break;
      case "deco":  ctx.save(); ctx.globalAlpha=0.7;
                    drawMarble(g.x[0],y0,g.x[1],y1); ctx.restore(); break;
      case "wall":  drawWall(g.x[0],y0,g.x[1],y1); break;
      case "oneway":drawOneway(g.x[0],y0,g.x[1],y1,T); break;
      case "vault": drawVault({x:g.x,y:[y0,y1]},T); break;
    }
  }
  // 창꽂기 면(발광 — 지형 위)
  for(const f of vis) for(const g of f.geo)
    if(g.t==="spear") drawSpearFace({x:g.x,y:[f.yOff+g.y[0],f.yOff+g.y[1]],face:g.face},T);

  // 오브젝트
  for(const f of vis){
    if(f.shrines) for(const s of f.shrines) drawShrine(s,f,T);
    if(f.dummies) for(const d of f.dummies) drawDummy(d,f,T);
    if(f.crystals)for(const c of f.crystals) drawCrystal(c,f,T);
    if(f.goal) drawBell(f,T);
    drawSpawn(f,T);
    if(f.entry) drawPortal(f.entry.x, f.yOff+f.entry.y, `↓ ${f.entry.from}F에서`, T);
    if(f.exit)  drawPortal(f.exit.x,  f.yOff+f.exit.y,  f.exit.physical?`↑ ${f.exit.to}F (통과)`:`↑ ${f.exit.to}F로`, T);
    if(ui.plan) drawSpearPlan(f,T);
  }

  // 부유 빛 입자
  ctx.save(); ctx.globalCompositeOperation="lighter";
  for(const m of MOTES){
    const my=(m.y + (T*0.00004*m.sp))%WORLD.y1;
    const X=sx(m.x), Y=sy(my+Math.sin(T*0.0009+m.ph)*0.12);
    if(X<-20||X>W+20||Y<-20||Y>H+20) continue;
    const a=0.18+0.16*Math.sin(T*0.002+m.ph);
    ctx.fillStyle=`rgba(214,238,255,${a})`;
    ctx.beginPath(); ctx.arc(X,Y,Math.max(0.8,m.r*cam.zoom),0,7); ctx.fill();
  }
  ctx.restore();

  // 비초점 층 디밍
  if(ui.floorFocus>0) for(const f of vis) if(f.n!==ui.floorFocus) dimFloor(f);

  drawGrid();
  if(ui.debug) for(const f of vis) drawDebugGeo(f);
  _lbBoxes.length=0;
  if(ui.labels){
    const order=[...vis].sort((a,b)=>(b.n===ui.floorFocus)-(a.n===ui.floorFocus));
    for(const f of order) drawLabels(f);
  }
  for(const f of vis) drawFloorTitle(f);

  drawVignette();
  drawMinimap();
  drawHUD(T);

  requestAnimationFrame(frame);
}
focusFloor(1);
cam.x=cam.tx; cam.y=cam.ty; cam.zoom=cam.tzoom;
requestAnimationFrame(frame);

/* 헤드리스 테스트용 노출 */
window.__MAP__={FLOORS,WORLD,REACH,CHECKS,cam,focusFloor,overview,ui};
</script>
